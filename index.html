      '    <div class="paper-head"><h3>Reversed by our own replication</h3></div>',
      '    <p class="claim">Why does this matter? An automated auditor that checks research extractions is right only about a third of the time, yet a wrong extraction can still return a theorem. We pre-registered three signals that might catch the error, then tested them once on frontier models. Two reversed. Cross-model disagreement is the one that held.</p>',

    var c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];

    var SC=[

      { name:'A crisis hits a democracy', end:13,

        init:function(){ x=0.92; y=0; th=0.85; target=0.85; rate=0; },

    function axes(){
