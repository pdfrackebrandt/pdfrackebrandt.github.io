    t=t.replace(/<div class="bio">[\s\S]*?<\/div>/,'<div class="bio"><p>MPhil in Economics, <a href="https://www.economics.ox.ac.uk/">University of Oxford</a>, <a href="https://www.merton.ox.ac.uk/">Merton</a>. Undergraduate dissertation at <a href="https://www.manchester.ac.uk/">Manchester</a> on volatility as a measure of price dislocation in commodity markets. Later worked in brokerage at a family office.</p><p>I want to solve politics. I study the incentive structures of hybrid regimes. Superintelligence will let agents handle nearly any task, which risks dissolving the social contract between elites and everyone else under democratic systems. How would we adapt? I have no clue. However, regime change is coming.</p><p>Aristotle and Polybius traced how constitutions decay and settled on the mixed republic, a <em>politeia</em> balancing claims of wealth and power against free birth, more resistant to degeneration. How to implement a given regime, under what conditions, and for which society motivates my research.</p><p><a href="mailto:pedro.fernandezrackebrandt@merton.ox.ac.uk">Feel free to email me for SI/AI consultancy.</a></p></div>');

      '    <div class="paper-head"><h3>How many tests was it really?</h3></div>',
      '    <p class="byline">with <a href="https://winzker.net/">Sebastian Winzker</a></p>',
      '    <p class="claim">Every parameter search is a multiple test. Cluster corrections for correlated trading rules cut the hurdle by as much as 84 percent and call noise significant. A block bootstrap on the real grid shows the nominal count is the safe one.</p>',
      '    <p>The bootstrap resamples the full grid of 2,825 moving average rules together, in blocks that average ten trading days, so the rules keep their real correlations. That gives the null distribution of the best Sharpe ratio: how high the top rule climbs when none has skill. N<sub>eff</sub> is the number of independent tests that would produce the same hurdle in the Bailey and López de Prado formula. On the DAX it is about 1,400.</p>',
      '    <p>Correlation spread evenly across the grid does not lower N<sub>eff</sub>. Rules bunched into blocks do. Of the corrections that read the count off the eigenvalues of the correlation matrix, only Gao (2008) stays close. The multiple testing correction raises the Sharpe ratio a rule must show by a factor of 7.3, while swapping N for N<sub>eff</sub> lowers it by 3.1 percent and departures from normality in daily returns add 0.2 percent. The best moving average rule survives in 3 of 17 markets and 2 of 31 German stocks, but not on the DAX.</p>',
      '    <details class="more">',
      '      <summary>How to read the figure</summary>',
      '      <div class="more-body">',
      '        <p>The curve is the expected maximum Sharpe ratio if every rule is noise. It grows like the square root of log N, so only the order of magnitude of N matters. The buttons read the hurdle at the cluster, effective, and nominal counts.</p>',
      '        <p>Software that clusters similar moving averages reports N = 2. That point sits far below the measured hurdle. The measured effective count is about 1,400. Using the raw grid of 2,825 overstates the hurdle by 6 percent.</p>',
      '        <p>On the DAX the best rule clears the mean of the noise maximum and still fails the 95 percent band.</p>',
      '      </div>',
      '    </details>',
      '    <div class="paper-tags"><span class="tag live">Working paper</span><span class="tag">Deflated Sharpe</span><span class="tag">Quantitative Finance</span></div>',

      '  <div class="paper-body">',
      '    <div class="paper-head"><h3>Reversed by our own replication</h3></div>',
      '    <p class="claim">An automated auditor is right about a third of the time, and a wrong extraction still returns a theorem. Five open-weight arms named three ways to catch that error. We deposited the rules, ran them once on four frontier families, and two of the three reversed. Cross-model disagreement is the one that held.</p>',
      '    <p>The test set is the 174 items of CausalReasoningBenchmark, scored with its authors’ own grader on each model’s most frequent answer. Every signal is judged by AUROC, the chance that it ranks a wrong extraction above a right one; 0.5 is chance and 1 is perfect. A model’s disagreement with its own repeated answers had to reach 0.65 in three of four families and did so only for Google, at 0.680. Disagreement across the four families faced the same bar and reached 0.753, with an interval of 0.661 to 0.840. The number of design fields a task asks for had to beat a model’s own disagreement in three families. It won in one.</p>',
      '    <p>The registration also named a result that would prove us wrong: models agreeing on the wrong answer when a design departs from convention. Instead, disagreement flagged errors better on those designs, 0.868 against 0.646, p = 0.025 by permutation. Neither ensemble breadth nor model accuracy explains the reversal. Abstaining on the half of the items where models disagree most cuts the error rate from 80.9 to 72.4 percent. The ranking is real. The product is still poor.</p>',

      '        <p>Task structure falls from 0.771 to about 0.50 and is retracted. Within-model sampling falls from 0.727 and clears the bar in one family of four. Cross-model disagreement rises from 0.609 to 0.753 and is held.</p>',
