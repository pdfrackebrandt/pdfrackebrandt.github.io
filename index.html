<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pedro F. Rackebrandt. Political economy and regime dynamics. Incoming MPhil Economics, Merton College, Oxford.">
<title>Pedro F. Rackebrandt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c2e4a'/%3E%3Cpath fill='%23f3efe4' d='M12.2 8.4h5.1c2.7 0 4.5 1.7 4.5 4.2 0 2.5-1.8 4.3-4.5 4.3h-3.1V23.4h-2V8.4zm2 6.7h3c1.6 0 2.5-1 2.5-2.5s-.9-2.4-2.5-2.4h-3v4.9z'/%3E%3C/svg%3E">
</head>
<body>
<script>
(function(){
  var url='https://raw.githubusercontent.com/pdfrackebrandt/pdfrackebrandt.github.io/192b8350f54b0f493c18a95abe0d9ab85c54338c/index.html';
  fetch(url).then(function(r){return r.text();}).then(function(t){
    t=t.replace(/<a class="skip"[^>]*>Skip to content<\/a>\s*/,'');

    var marker='<div class="axiom-wrap">';
    var start=t.indexOf(marker);
    if(start>0){
      var art=t.lastIndexOf('<article class="paper">', start);
      var end=t.indexOf('</article>', start);
      if(art>=0 && end>art) t=t.slice(0,art)+t.slice(end+10);
    }

    t=t.replace('<span class="tag live">In progress</span>','<span class="tag live">Work in progress</span>');
    t=t.replace('<div class="sec-head"><h2>Research</h2></div>','<div class="sec-head"><h2>Research</h2><p class="sec-kicker">Work in progress</p></div>');

    t=t.replace(
      'family=Lato:ital,wght@0,300;0,400;0,700;1,400',
      'family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,400;0,500;0,600;1,400'
    );
    t=t.replace(
      '--f-display:Lato,Verdana,Helvetica,Arial,sans-serif;\n  --f-body:Lato,Verdana,Helvetica,Arial,sans-serif;\n  --f-mono:Lato,Verdana,Helvetica,Arial,sans-serif;',
      '--f-display:"Instrument Serif",Georgia,"Times New Roman",serif;\n  --f-body:Inter,system-ui,Helvetica,Arial,sans-serif;\n  --f-mono:Inter,system-ui,Helvetica,Arial,sans-serif;'
    );

    t=t.replace(
      'a{color:var(--link);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);transition:color .15s,text-decoration-color .15s}',
      'a{color:var(--link);text-decoration:none;transition:color .15s}'
    );
    t=t.replace(
      'a:hover{color:var(--accent);text-decoration-color:var(--accent)}',
      'a:hover{color:var(--accent)}'
    );
    t=t.replace(
      '.quicklinks a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}',
      '.quicklinks a:hover{color:var(--accent)}'
    );

    if(t.indexOf('.sec-kicker')<0){
      t=t.replace(
        '.sec-head h2{font-size:var(--step-2);letter-spacing:0;font-weight:400}',
        '.sec-head{justify-content:space-between;gap:12px 24px;flex-wrap:wrap}.sec-head h2{font-size:var(--step-2);letter-spacing:0;font-weight:400}.sec-kicker{font-family:var(--f-mono);font-size:var(--step--1);color:var(--signal);letter-spacing:.06em;text-transform:uppercase;margin:0}'
      );
    }

    var icon='<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' fill=\'%230c2e4a\'/%3E%3Cpath fill=\'%23f3efe4\' d=\'M12.2 8.4h5.1c2.7 0 4.5 1.7 4.5 4.2 0 2.5-1.8 4.3-4.5 4.3h-3.1V23.4h-2V8.4zm2 6.7h3c1.6 0 2.5-1 2.5-2.5s-.9-2.4-2.5-2.4h-3v4.9z\'/%3E%3C/svg%3E">';
    t=t.replace(/<link rel="icon"[^>]*>/, icon);

    document.open();
    document.write(t);
    document.close();
  }).catch(function(){
    document.body.textContent='Could not load the page.';
  });
})();
</script>
</body>
</html>
