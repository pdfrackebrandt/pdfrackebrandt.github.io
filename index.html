      '    <div class="paper-head"><h3>Reversed by our own replication</h3></div>',
      '    <p class="claim">An automated auditor is right about a third of the time, and a wrong extraction still returns a theorem. Five open-weight arms named three ways to catch that error. We deposited the rules, ran them once on four frontier families, and two of the three reversed. Cross-model disagreement is the one that held.</p>',
      '    <p>The test set is the 174 items of CausalReasoningBenchmark, scored with its authors’ own grader on each model’s most frequent answer. Every signal is judged by AUROC, the chance that it ranks a wrong extraction above a right one; 0.5 is chance and 1 is perfect. A model’s disagreement with its own repeated answers had to reach 0.65 in three of four families and did so only for Google, at 0.680. Disagreement across the four families faced the same bar and reached 0.753, with an interval of 0.661 to 0.840. The number of design fields a task asks for had to beat a model’s own disagreement in three families. It won in one.</p>',
      '    <p>The registration also named a result that would prove us wrong: models agreeing on the wrong answer when a design departs from convention. Instead, disagreement flagged errors better on those designs, 0.868 against 0.646, p = 0.025 by permutation. Neither ensemble breadth nor model accuracy explains the reversal. Abstaining on the half of the items where models disagree most cuts the error rate from 80.9 to 72.4 percent. The ranking is real. The product is still poor.</p>',

    t=t.replace(/<p class="claim">Democracies decay[\s\S]*?<\/p>/,'<p class="claim">Many countries swing between democracy and autocracy for decades; Polybius called it anacyclosis. In my model the swings need no run of bad luck, and the economy decides when they run. Young autocracies that fall behind their neighbours open up, crises keep them shut and break young democracies, and new autocracies often fall when a neighbour turns democratic, until they consolidate. All three predictions hold in V-Dem data since 1950.</p><p>The model tracks two things, how inclusive the regime is and how mobilized its population is; these are the flat axes of the figure. The height is K, the pool of young people free to be mobilized, measured from a threshold K*. Below K*, a shock sets off swings that shrink every round but keep a fixed tempo, the model’s own period. Above it they stop shrinking and the country cycles by itself. Mathematically, the threshold is a Hopf bifurcation. Falling behind the neighbours enlarges the pool and lifts a country over. A crisis speeds the erosion of institutions, which drops it back below and closes the regime. The tests run on V-Dem from 1950 to 2019, under eight different codings of regime type.</p>');

  function invNorm(p){
    var a=[-39.69683028665376,220.9460984351125,-275.9285104469687,138.3577509074756,-30.66479806614716,2.506628277459239];
    var b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.2806807164995];
    var c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
    var d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
    var plow=0.02425, phigh=1-plow, q, r;
    if(p<plow){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    if(p>phigh){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }
  function hurdle(N){
    N=Math.max(N,1.2);
    var g=0.5772156649, s=0.0918;
    return s*((1-g)*invNorm(1-1/N)+g*invNorm(1-1/(N*Math.E)));
  }
  function xOf(N){ return 44+(Math.log(N)/Math.LN10)/5*250; }
  function yOf(h){ return 168-h/0.56*144; }
  function fmtN(N){
    if(N>=100000) return Math.round(N/1000)+'k';
    if(N>=10000) return (N/1000).toFixed(N%1000?1:0)+'k';
    return Math.round(N).toLocaleString('en-US');
  }
  function initHurdle(){
    var svg=document.getElementById('hurdle');
    if(!svg) return;
    var cur=document.getElementById('hurdle-cursor');
    var hair=document.getElementById('hurdle-hair');
    var dot=document.getElementById('hurdle-dot');
    var read=document.getElementById('hurdle-read');
    function show(N, label){
      N=Math.min(1e5, Math.max(2, N));
      var h=hurdle(N), x=xOf(N), y=yOf(h);
      cur.setAttribute('visibility','visible');
      hair.setAttribute('x1', x); hair.setAttribute('x2', x);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      var tag=label? label+' \u00b7 ':'';
      read.textContent=tag+'N = '+fmtN(N)+'   hurdle = '+h.toFixed(2);
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'), function(btn){
      btn.addEventListener('click', function(){
        var N=+btn.getAttribute('data-jump');
        var names={2:'cluster',1400:'effective',2825:'nominal'};
        show(N, names[N]||'');
      });
    });
  }
