<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pedro F. Rackebrandt. Political economy and regime dynamics. Incoming MPhil Economics, Merton College, Oxford.">
<title>Pedro F. Rackebrandt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c2e4a'/%3E%3Cpath fill='%23f3efe4' d='M12.2 8.4h5.1c2.7 0 4.5 1.7 4.5 4.2 0 2.5-1.8 4.3-4.5 4.3h-3.1V23.4h-2V8.4zm2 6.7h3c1.6 0 2.5-1 2.5-2.5s-.9-2.4-2.5-2.4h-3v4.9z'/%3E%3C/svg%3E">
</head>
<body>
<script>
(function(){
  var url='https://raw.githubusercontent.com/pdfrackebrandt/pdfrackebrandt.github.io/192b8350f54b0f493c18a95abe0d9ab85c54338c/index.html';
  fetch(url).then(function(r){return r.text();}).then(function(t){
    t=t.replace(/<a class="skip"[^>]*>Skip to content<\/a>\s*/,'');

    var marker='<div class="axiom-wrap">';
    var start=t.indexOf(marker);
    if(start>0){
      var art=t.lastIndexOf('<article class="paper">', start);
      var end=t.indexOf('</article>', start);
      if(art>=0 && end>art) t=t.slice(0,art)+t.slice(end+10);
    }

    t=t.replace('<span class="tag live">In progress</span>','<span class="tag live">Work in progress</span>');
    t=t.replace('<div class="sec-head"><h2>Research</h2></div>','<div class="sec-head"><h2>Research</h2><p class="sec-kicker">Work in progress</p></div>');

    t=t.replace(
      'family=Lato:ital,wght@0,300;0,400;0,700;1,400',
      'family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,400;0,500;0,600;1,400'
    );
    t=t.replace(
      '--f-display:Lato,Verdana,Helvetica,Arial,sans-serif;\n  --f-body:Lato,Verdana,Helvetica,Arial,sans-serif;\n  --f-mono:Lato,Verdana,Helvetica,Arial,sans-serif;',
      '--f-display:"Instrument Serif",Georgia,"Times New Roman",serif;\n  --f-body:Inter,system-ui,Helvetica,Arial,sans-serif;\n  --f-mono:Inter,system-ui,Helvetica,Arial,sans-serif;'
    );

    t=t.replace('--link:#1C3C5A;','--link:#0c2e4a;');
    t=t.replace('--accent:#22557E;','--accent:#061d30;');
    t=t.replaceAll('--link:#AFC9DE;','--link:#8ca8c4;');
    t=t.replaceAll('--accent:#84B8E2;','--accent:#c5d4e3;');

    t=t.replace(
      'a{color:var(--link);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2.5px;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);transition:color .15s,text-decoration-color .15s}',
      'a{color:var(--link);text-decoration:none;transition:color .15s}'
    );
    t=t.replace(
      'a:hover{color:var(--accent);text-decoration-color:var(--accent)}',
      'a:hover{color:var(--accent)}'
    );
    t=t.replace(
      '.quicklinks a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}',
      '.quicklinks a:hover{color:var(--accent)}'
    );

    t=t.replace(
      'I study MPhil Economics at the <a href="https://www.economics.ox.ac.uk/">University of Oxford</a>, <a href="https://www.merton.ox.ac.uk/">Merton College</a>. I like to learn about frontier AI and economics.',
      'I study MPhil Economics at the <a href="https://www.economics.ox.ac.uk/">University of Oxford</a>, <a href="https://www.merton.ox.ac.uk/">Merton College</a>. As an undergraduate at the <a href="https://www.manchester.ac.uk/">University of Manchester</a>, I used volatility to measure price dislocation in commodity markets.'
    );
    t=t.replace(
      'As an undergraduate at the <a href="https://www.manchester.ac.uk/">University of Manchester</a> I used volatility to measure price dislocation in commodity markets. I then spent time in institutional brokerage before returning to research.',
      'I later worked in institutional brokerage. I research political economy and consult on graph engineering and multi-model AI systems.'
    );

    if(t.indexOf('.sec-kicker')<0){
      t=t.replace(
        '.sec-head h2{font-size:var(--step-2);letter-spacing:0;font-weight:400}',
        '.sec-head{justify-content:space-between;gap:12px 24px;flex-wrap:wrap}.sec-head h2{font-size:var(--step-2);letter-spacing:0;font-weight:400}.sec-kicker{font-family:var(--f-mono);font-size:var(--step--1);color:var(--signal);letter-spacing:.06em;text-transform:uppercase;margin:0}'
      );
    }

    if(t.indexOf('.hurdle-fig')<0){
      t=t.replace(
        '.paper-fig{min-width:0;display:flex;flex-direction:column;gap:9px}',
        '.paper-fig{min-width:0;display:flex;flex-direction:column;gap:9px}.hurdle-fig{width:100%;height:auto;background:var(--canvas-bg);border:1px solid var(--rule);display:block}.hurdle-fig text{font-family:var(--f-mono)}'
      );
    }

    var extraPaper = ""
      + "\n        <article class=\"paper\">\n"
      + "          <div class=\"paper-fig\">\n"
      + "            <svg class=\"hurdle-fig\" viewBox=\"0 0 306 220\" role=\"img\" aria-label=\"Search hurdle rising only with the order of magnitude of N.\">\n"
      + "              <rect width=\"306\" height=\"220\" fill=\"var(--canvas-bg)\"/>\n"
      + "              <g fill=\"none\" stroke=\"var(--canvas-line)\" stroke-width=\"1\">\n"
      + "                <line x1=\"44\" y1=\"18\" x2=\"44\" y2=\"178\"/>\n"
      + "                <line x1=\"44\" y1=\"178\" x2=\"292\" y2=\"178\"/>\n"
      + "              </g>\n"
      + "              <g fill=\"var(--faint)\" font-size=\"9\">\n"
      + "                <text x=\"8\" y=\"24\">E[max SR]</text>\n"
      + "                <text x=\"8\" y=\"178\">0</text>\n"
      + "                <text x=\"36\" y=\"108\">0.3</text>\n"
      + "                <text x=\"44\" y=\"194\">1</text>\n"
      + "                <text x=\"132\" y=\"194\">100</text>\n"
      + "                <text x=\"210\" y=\"194\">10k</text>\n"
      + "                <text x=\"248\" y=\"208\">trials N (log)</text>\n"
      + "              </g>\n"
      + "              <path d=\"M44,170 C70,156 90,142 110,128 C140,110 170,96 210,82 C240,72 270,64 292,58\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/>\n"
      + "              <g stroke=\"var(--signal)\" stroke-dasharray=\"3 3\" stroke-width=\"1\">\n"
      + "                <line x1=\"58\" y1=\"162\" x2=\"58\" y2=\"178\"/>\n"
      + "                <line x1=\"196\" y1=\"86\" x2=\"196\" y2=\"178\"/>\n"
      + "                <line x1=\"224\" y1=\"78\" x2=\"224\" y2=\"178\"/>\n"
      + "              </g>\n"
      + "              <g fill=\"var(--signal)\">\n"
      + "                <circle cx=\"58\" cy=\"162\" r=\"3\"/>\n"
      + "                <circle cx=\"196\" cy=\"86\" r=\"3\"/>\n"
      + "                <circle cx=\"224\" cy=\"78\" r=\"3\"/>\n"
      + "              </g>\n"
      + "              <g fill=\"var(--muted)\" font-size=\"8\">\n"
      + "                <text x=\"62\" y=\"158\">cluster N=2</text>\n"
      + "                <text x=\"148\" y=\"76\">Neff ~ 1,400</text>\n"
      + "                <text x=\"228\" y=\"74\">nominal 2,825</text>\n"
      + "              </g>\n"
      + "            </svg>\n"
      + "            <p class=\"fig-note\">DAX grid, 2,825 MA rules. The hurdle barely moves between Neff and M.</p>\n"
      + "          </div>\n"
      + "          <div class=\"paper-body\">\n"
      + "            <div class=\"paper-head\"><h3>How many tests was it really?</h3></div>\n"
      + "            <p class=\"claim\">Every parameter search is a multiple test. Cluster corrections for correlated trading rules cut the hurdle by as much as 84 percent and call noise significant. A block bootstrap on the real grid shows the nominal count is the safe one. With <a href=\"https://winzker.net/\">Sebastian Winzker</a>.</p>\n"
      + "            <details class=\"more\">\n"
      + "              <summary>How to read the figure</summary>\n"
      + "              <div class=\"more-body\">\n"
      + "                <p>The curve is the expected maximum Sharpe ratio if every rule is noise. It grows like the square root of log N, so only the order of magnitude of N matters.</p>\n"
      + "                <p>Software that clusters similar moving averages reports N = 2. That point sits far below the measured hurdle. The measured effective count is about 1,400. Using the raw grid of 2,825 overstates the hurdle by 6 percent.</p>\n"
      + "                <p>On the DAX the best rule clears the mean of the noise maximum and still fails the 95 percent band.</p>\n"
      + "              </div>\n"
      + "            </details>\n"
      + "            <details class=\"more\">\n"
      + "              <summary>The technical version</summary>\n"
      + "              <div class=\"more-body\">\n"
      + "                <p>Stationary block bootstrap of the full rule grid, mean block length ten days, yields the null distribution of the maximum Sharpe ratio. Neff is the independent trial count that reproduces that hurdle in the Bailey and Lopez de Prado formula.</p>\n"
      + "                <p>Even correlation does not cut Neff. Block structure does. Gao (2008) is the only eigenvalue correction that stays close. Multiplicity moves the required Sharpe by a factor of 7.3; the N versus Neff swap moves it by minus 3.1 percent; daily non-normality by plus 0.2 percent.</p>\n"
      + "                <p>Best moving-average rule survives in 3 of 17 markets and 2 of 31 German stocks. Not on the DAX.</p>\n"
      + "              </div>\n"
      + "            </details>\n"
      + "            <div class=\"paper-tags\"><span class=\"tag live\">Working paper</span><span class=\"tag\">Deflated Sharpe</span><span class=\"tag\">Technical analysis</span></div>\n"
      + "          </div>\n"
      + "        </article>\n";

    var anchor = t.indexOf('Why regimes go round in circles');
    if(anchor>=0){
      var close = t.indexOf('</article>', anchor);
      if(close>=0) t = t.slice(0, close+10) + extraPaper + t.slice(close+10);
    }

    // Paper B update (October 2026): text and 3D figure follow the current draft
    t=t.replace('<h3>Why regimes go round in circles</h3>','<h3>When regimes cycle</h3>');
    t=t.replace(/aria-label="Rotatable 3D phase portrait[^"]*"/,'aria-label="Rotatable 3D phase portrait: political swings fade below the threshold and keep going above it."');
    t=t.replace('<button class="btn" id="shock" type="button">Shock it</button>','<button class="btn" id="shock" type="button">Shock it</button><button class="btn" id="fallbehind" type="button">Fall behind</button><button class="btn" id="crisis" type="button">Crisis</button>');
    t=t.replace(/<p class="claim">Democracies decay[\s\S]*?<\/p>/,'<p class="claim">Many countries swing between democracy and autocracy for decades; Polybius called it anacyclosis. In my model the swings need no run of bad luck, and the economy decides when they run. Young autocracies that fall behind their neighbours open up, crises keep them shut and break young democracies, and new autocracies often fall when a neighbour turns democratic, until they consolidate. All three predictions hold in V-Dem data since 1950.</p>');
    t=t.replace(/<p><b>The wobble\.<\/b>[\s\S]*?<p><b>Test it\.<\/b>[\s\S]*?<\/p>/,'<p><b>The wobble.</b> Think of a country’s politics as a wobble between more open and more closed rule. The blue line is that wobble over time. A wide loop means big swings between democracy and autocracy; a tight loop means calm.</p><p><b>The height.</b> Height is the pool of young people free to be mobilized. A young country that falls behind its neighbours rises. A crisis pulls it down and shuts it.</p><p><b>Below the dashed square</b> a shock fades, but in loops. The country swings back and forth a few times before it settles, so a new regime is safest at first and most at risk some years later.</p><p><b>Above it</b> the loop never closes and the country keeps going round, until its economy catches up and it sinks back below.</p><p><b>Test it.</b> Press Fall behind and watch the loop open. Press Crisis and it shuts. Left alone, the country has a bad year now and then.</p>');
    t=t.replace(/<p>The normal form of a Hopf bifurcation[\s\S]*?<\/p>/,'<p>The normal form of the Hopf bifurcation at the threshold K* = 1/h + 2m*, integrated live with small shocks. The horizontal axes are inclusiveness x and mobilization m around the steady state. The vertical axis is the ceiling K, the pool of young people free to be mobilized, measured from K*. Below K* the steady state is a stable focus, so shocks fade in loops at the model’s own period; above it a limit cycle appears. Falling behind the neighbours raises K, and a crisis speeds the erosion of institutions, which moves the country away from the threshold and closes it. Tested on V-Dem, 1950 to 2019, across eight regime codings.</p>');
    t=t.replace(/<span class="tag live">[^<]*<\/span><span class="tag">Nonlinear dynamics<\/span><span class="tag">V-Dem<\/span>/,'<span class="tag live">Working paper</span><span class="tag">Nonlinear dynamics</span><span class="tag">Political economy</span><span class="tag">V-Dem</span>');
    t=t.replace('var XR=1.5, TH0=-0.5, TH1=1.8,','var XR=1.5, TH0=-0.5, TH1=1.5,');
    t=t.replace('var x=1.3,y=0,th=TH0,tt=0,pts=[];','var x=1.3,y=0,th=-0.35,tt=0,pts=[],lastEv=0,nextEv=9;');
    t=t.replace('th+=dt*EPS*SPEED; tt+=dt;','th+=dt*0.08*(-0.35-th); tt+=dt;');
    t=t.replace('if(th>TH1) reset();','if(pts.length>2600) pts.shift(); if(tt>nextEv){ if(tt-lastEv>8){ if(Math.random()<0.6){ th=Math.min(TH1-0.05,th+0.6); } else { var a2=Math.random()*6.2832; x+=0.6*Math.cos(a2); y+=0.6*Math.sin(a2); } } nextEv=tt+10+Math.random()*8; }');
    t=t.replace('function reset(){x=1.3;y=0;th=TH0;tt=0;pts=[];}','function reset(){x=1.3;y=0;th=-0.35;tt=0;pts=[];lastEv=0;nextEv=9;}');
    t=t.replace("[[lo,'x'],[hi,'y']]","[[lo,'x'],[hi,'m']]");
    t=t.replace("txt('\\u03b8',[tp[0]-12,tp[1]-16],C.muted,'right');","txt('K \\u2212 K*',[tp[0]-12,tp[1]-16],C.muted,'right');");
    t=t.replace("txt('tipping point',out(e,26),C.faint);","txt('threshold K*',out(e,26),C.faint);");
    t=t.replace('var a=Math.random()*6.2832;x+=0.6*Math.cos(a);y+=0.6*Math.sin(a);','var a=Math.random()*6.2832;x+=0.6*Math.cos(a);y+=0.6*Math.sin(a);lastEv=tt;');
    t=t.replace('var drag=false,lx=0,ly=0;','var fb=document.getElementById(\'fallbehind\');if(fb)fb.addEventListener(\'click\',function(){th=Math.min(TH1-0.05,th+0.6);lastEv=tt;});var cr=document.getElementById(\'crisis\');if(cr)cr.addEventListener(\'click\',function(){th=Math.max(TH0+0.05,th-0.5);x-=0.5;lastEv=tt;});var drag=false,lx=0,ly=0;');
    var icon='<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' fill=\'%230c2e4a\'/%3E%3Cpath fill=\'%23f3efe4\' d=\'M12.2 8.4h5.1c2.7 0 4.5 1.7 4.5 4.2 0 2.5-1.8 4.3-4.5 4.3h-3.1V23.4h-2V8.4zm2 6.7h3c1.6 0 2.5-1 2.5-2.5s-.9-2.4-2.5-2.4h-3v4.9z\'/%3E%3C/svg%3E">';
    t=t.replace(/<link rel="icon"[^>]*>/, icon);

    document.open();
    document.write(t);
    document.close();
  }).catch(function(){
    document.body.textContent='Could not load the page.';
  });
})();
</script>
