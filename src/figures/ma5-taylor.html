<figure class="nfig" data-nfig="ma5-taylor">
  <div class="nfig-seg" role="group" aria-label="Scale"><button type="button" class="nfig-opt" data-mode="lev" aria-pressed="true">Levels</button><button type="button" class="nfig-opt" data-mode="dev" aria-pressed="false">Deviations</button></div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">expansion point </span>x*</span><input type="range" min="0.5" max="2.5" step="0.05" value="1" data-k="xs"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">evaluation point </span>x</span><input type="range" min="0.1" max="3" step="0.05" value="1.5" data-k="x"><span class="nfig-val" aria-hidden="true">1.50</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 286" role="img" aria-label="Levels: the curve f of x equals x squared in blue, its first order Taylor approximation at x star as a purple tangent line, and a red segment at x showing the error. Deviations: the percent deviation of f against the percent deviation of x, which bends, and the log deviation of f against the log deviation of x, a straight line of slope 2 that lies exactly on the first order line."></svg>
  <p class="fig-note nfig-read" aria-live="polite">f(x) = 2.25   first order 1.00 + 2.00 × (1.50 − 1.00) = 2.00
error f(x) − first order = 0.2500 = (x − x*)²</p>
  <figcaption>Levels: f(x) = x² in blue and its first order Taylor approximation at x*, the purple tangent; the red segment is the error, exactly (x − x*)². Deviations: the same function written in percent deviations from x* (blue, it bends) and in log deviations (green, a straight line of slope 2 that the first order line covers exactly). Move x* and x, or switch the scale.</figcaption>
</figure>
