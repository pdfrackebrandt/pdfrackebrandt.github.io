<figure class="nfig" data-nfig="mi6-allais">
  <div class="nfig-seg" role="group" aria-label="Model of preferences">
    <button type="button" class="nfig-opt" data-model="eu" aria-pressed="true">Expected utility</button>
    <button type="button" class="nfig-opt" data-model="fan" aria-pressed="false">Fanning out (weighted utility)</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">u(1M)</span><input type="range" min="0.5" max="0.99" step="0.01" value="0.8" data-k="v"><span class="nfig-val" aria-hidden="true">0.80</span></label>
    <label class="nfig-range"><span class="nfig-name">weight on 0</span><input type="range" min="1" max="4" step="0.1" value="3" data-k="w"><span class="nfig-val" aria-hidden="true">3.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 340" role="img" aria-label="The probability triangle for the prizes 0, 1 million and 5 million dollars: the probability of 0 runs along the bottom and the probability of 5 million up the side, so the bottom left corner is 1 million for sure. The four Allais lotteries A, B, C and D are marked, with the segments from A to B and from C to D in red; they are parallel and equally long. Blue lines are indifference lines; filled dots mark the lottery chosen in each pair."></svg>
  <p class="fig-note nfig-read" aria-live="polite">expected utility: every indifference line has slope 4.00; the red segments have slope 10
V(A) = 0.800, V(B) = 0.812: B ≻ A   V(C) = 0.088, V(D) = 0.100: D ≻ C</p>
  <figcaption>The Allais lotteries in the probability triangle, with u(0) = 0 and u(5M) = 1. Under expected utility the indifference lines are parallel, so they cut the two parallel red segments the same way. The weighted utility option keeps the lines straight but lets them fan out.</figcaption>
</figure>
