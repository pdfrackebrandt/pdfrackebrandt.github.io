  <p class="fig-note nfig-read" aria-live="polite">p₁ = 5.00 (p̂₁ = +25.0%), p₂ = 4: (w, r) = (1.375, 0.875)

labour shares at A: 0.75 in good 1, 0.25 in good 2, so ŵ = 1.50 p̂₁ and r̂ = −0.50 p̂₁</p>
  <figcaption>Stolper Samuelson with c₁ = 3w + r and c₂ = w + 3r, p₂ = 4. Left: the zero profit lines c₁ = p₁ and c₂ = 4 in (w, r) space, slopes −3 and −0.33. Raising p₁ shifts the steep, labour intensive line out and moves the intersection from A = (1, 1) along c₂ = 4 to B. Right: the magnification effect, ŵ > p̂₁ > 0 > r̂, so labour gains in terms of both goods and capital loses in terms of both. Flip the intensity and the roles of w and r swap.</figcaption>
