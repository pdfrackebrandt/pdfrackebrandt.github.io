<figure class="nfig" data-nfig="l3-quad">
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Example matrix">
    <button type="button" class="nfig-opt" data-ex="pd" aria-pressed="true">Positive definite</button>
    <button type="button" class="nfig-opt" data-ex="psd" aria-pressed="false">Semidefinite</button>
    <button type="button" class="nfig-opt" data-ex="ind" aria-pressed="false">Indefinite, slide 34</button>
    <button type="button" class="nfig-opt" data-ex="nd" aria-pressed="false">Negative definite</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">a</span><input type="range" min="-4" max="4" step="0.1" value="2" data-k="a"><span class="nfig-val" aria-hidden="true">2.0</span></label>
    <label class="nfig-range"><span class="nfig-name">b</span><input type="range" min="-3" max="3" step="0.1" value="0.8" data-k="b"><span class="nfig-val" aria-hidden="true">0.8</span></label>
    <label class="nfig-range"><span class="nfig-name">c</span><input type="range" min="-4" max="4" step="0.1" value="1" data-k="c"><span class="nfig-val" aria-hidden="true">1.0</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Level curves of the quadratic form x′Ax for the symmetric matrix A with rows (a, b) and (b, c): blue where the form is positive, red where it is negative, green lines where it is zero. Grey arrows mark the eigenvectors with their eigenvalues. A draggable probe shows the level curve through it and the direction of the gradient 2Ax."></svg>
  <p class="fig-note nfig-read" aria-live="polite">λ = 2.44 and 0.56   a = 2.0 &gt; 0 and det A = 1.36 &gt; 0: positive definite
at x = (1.20, −0.60): x′Ax = 2.09   2Ax = (3.84, 0.72)</p>
  <figcaption>Pick an example or move a, b and c. Positive definite gives nested ellipses, a bowl; as det A = ac − b² falls to 0 the ellipses stretch into parallel lines, a trough; below 0 they turn into a saddle with a red region where x′Ax is negative. Drag the probe: the gradient arrow is always at right angles to the level curve through it.</figcaption>
</figure>
