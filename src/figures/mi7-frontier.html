<figure class="nfig" data-nfig="mi7-frontier">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn mi7-toopt">Move ȳ to y(p)</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1, with p₂ = 2, </span>p₁</span><input type="range" min="0.2" max="3.2" step="0.05" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 420" role="group" aria-label="Netput space with y1 across and y2 up, on equal scales. The production set Y = {y : F(y) ≤ 0} with F(y) = y1 + y2 + 0.15 y1 squared is shaded green below its frontier, which passes through the origin. A draggable plan y bar sits on the frontier with the dashed tangent there and the red gradient of F, normal to the frontier. The blue point y(p) is the profit maximising plan at p = (p1, 2), with the blue price vector p and the blue iso profit line p·y = π(p) touching the frontier; a dashed grey iso profit line runs through y bar. Drag y bar, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ȳ = (−2.50, 1.56)   MRT₁₂(ȳ) = F₁/F₂ = 1 + 0.3ȳ₁ = 0.25   p₁/p₂ = 0.50
MRT₁₂ &lt; p₁/p₂: profit rises as ȳ moves right along the frontier
p = (1.00, 2.00): y(p) = (−1.67, 1.25), good 1 makes good 2   π(p) = 0.83 &gt; p·ȳ = 0.63</p>
  <figcaption>The frontier F(y) = y₁ + y₂ + 0.15y₁² = 0 on equal scales: good 1 makes good 2 in the north west, good 2 makes good 1 in the south east. Drag the plan ȳ: ∇F(ȳ) is normal to the frontier and the tangent has slope −MRT₁₂. Move p₁ with p₂ = 2: the profit maximising plan y(p) sets p₁/p₂ = MRT₁₂, where the price vector is normal to the frontier and the highest iso profit line touches it.</figcaption>
</figure>
