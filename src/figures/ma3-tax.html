<figure class="nfig" data-nfig="ma3-tax">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">capital income tax rate </span>τ</span><input type="range" min="-0.5" max="0.6" step="0.01" value="0.3" data-k="tau"><span class="nfig-val" aria-hidden="true">0.30</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">inverse elasticity of intertemporal substitution </span>σ</span><input type="range" min="0.25" max="5" step="0.05" value="2" data-k="sigma"><span class="nfig-val" aria-hidden="true">2.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 480" role="img" aria-label="Phase diagram for an unexpected permanent tax on capital income, rebated lump sum. The c dot = 0 line moves left from its dashed old position; the k dot = 0 hump does not move. Consumption jumps vertically from the old steady state onto the new red saddle path, then c and k slide down it to the new steady state. The panel below shows c and k over time as a percentage of the old steady state."></svg>
  <p class="fig-note nfig-read" aria-live="polite">τ = 0.20: f′(k) = (δ + ρ)/(1 − τ) = 0.1875, so the steady state k goes from 2.69 to 1.96</p>
  <figcaption>An unexpected, permanent capital income tax τ, rebated lump sum (α = 0.3, δ = 0.1, ρ = 0.05). Only the ċ = 0 line moves. Capital cannot jump, so consumption jumps onto the new saddle path and then falls with capital to the new steady state. Negative τ is a subsidy.</figcaption>
</figure>
