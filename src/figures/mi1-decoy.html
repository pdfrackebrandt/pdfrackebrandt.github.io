<figure class="nfig" data-nfig="mi1-decoy">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 368" role="group" aria-label="Three draggable options x, y and d on the unit square of two attributes, more is better on both. The box of bundles dominated by x is shaded blue and the box dominated by y green; where they overlap, a bundle is dominated by both."></svg>
  <p class="fig-note nfig-read" aria-live="polite">d = (0.16, 0.70): dominated by x only: a decoy for x
increasing preferences never choose a dominated d, and any rational population has P(x | {x, y, d}) ≤ P(x | {x, y})
observed: P(x | {x, y, d}) &gt; P(x | {x, y}), a regularity violation</p>
  <figcaption>Two options x and y trade off two attributes, and a third option d is added. Blue: everything x dominates; green: everything y dominates. Drag d into the strip only x dominates and it is a decoy for x: adding it raises the share of x in experiments, which no rational population can do. Drag any point, or focus one and use the arrow keys.</figcaption>
</figure>
