<figure class="nfig" data-nfig="normal">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">mean </span>μ</span><input type="range" min="-2" max="2" step="0.1" value="0" data-k="mu"><span class="nfig-val" aria-hidden="true">0.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">standard deviation </span>σ</span><input type="range" min="0.3" max="2" step="0.05" value="1" data-k="sd"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 250" role="img" aria-label="Normal density with mean μ and standard deviation σ on fixed axes, x from −5 to 5 and height up to 1.4. The band from μ − σ to μ + σ is shaded and holds 68.3% of the probability. A dashed line marks height 1."></svg>
  <p class="fig-note nfig-read" aria-live="polite">μ = 0.0   σ = 1.00   peak = 0.40</p>
  <figcaption>Slide σ down to 0.3: the curve gets narrow and tall, the shaded band still holds 68.3% of the area, and the peak climbs past 1. A density is a height, not a probability.</figcaption>
</figure>
