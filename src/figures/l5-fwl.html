<figure class="nfig" data-nfig="l5-fwl">
  <div class="fig-controls nfig-bar">
    <div class="nfig-seg nfig-seg4" role="group" aria-label="Regression shown">
      <button type="button" class="nfig-opt" data-mode="yx" aria-pressed="true">y on x₃</button>
      <button type="button" class="nfig-opt" data-mode="fwl" aria-pressed="false">r̂<sub>y</sub> on r̂₃</button>
      <button type="button" class="nfig-opt" data-mode="yr" aria-pressed="false">y on r̂₃</button>
      <button type="button" class="nfig-opt" data-mode="rx" aria-pressed="false">r̂<sub>y</sub> on x₃</button>
    </div>
    <button type="button" class="btn nfig-new">New sample</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">correlation ρ of x₂, x₃</span><input type="range" min="-0.9" max="0.9" step="0.05" value="0.6" data-k="rho"><span class="nfig-val" aria-hidden="true">0.60</span></label>
    <label class="nfig-range"><span class="nfig-name">effect β₂ of x₂</span><input type="range" min="-2" max="2" step="0.1" value="1" data-k="b2"><span class="nfig-val" aria-hidden="true">1.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 300" role="img" aria-label="Scatter of one sample of 60 observations from y = 1 + beta2 x2 + x3 + u. The buttons choose the regression on show: y on x3, the residuals of y on the residuals of x3 after each is regressed on an intercept and x2, y on the residuals of x3, or the residuals of y on x3. A solid red line is that regression's fitted line; a dashed blue line through the same means has the slope of x3 in the full regression of y on an intercept, x2 and x3. The two lines coincide for the residual on residual regression and for y on the residuals of x3. For y on x3 the slope is beta3 hat plus beta2 hat times theta hat, where theta hat is the slope of x2 on x3."></svg>
  <p class="fig-note nfig-read" aria-live="polite">full regression   <span class="l5-hat">β</span>₂ = 1.004   <span class="l5-hat">β</span>₃ = 1.021
y on x₃   slope 1.623 = <span class="l5-hat">β</span>₃ + <span class="l5-hat">β</span>₂<span class="l5-hat">θ</span> = 1.021 + 1.004 × 0.60</p>
  <figcaption>One sample of N = 60 from y = 1 + β₂x₂ + x₃ + u, so β₃ = 1, with u ~ N(0, 1) and W = [ι, x₂]. The sample correlation of x₂ and x₃ is exactly ρ and both have the same spread, so <span class="l5-hat">θ</span><span class="l5-mark">̂</span>, the slope of x₂ on x₃, equals ρ. Pick a regression: the red line is its fit, the dashed blue line has the slope <span class="l5-hat">β</span><span class="l5-mark">̂</span>₃ of the full regression, and both pass through the panel's means (open circle). r̂ marks residuals after regressing on W.</figcaption>
</figure>
