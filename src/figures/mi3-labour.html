  <figcaption>Consumption and leisure with constant elasticity of substitution σ and equal weights, time T = 1 and nonlabour income M; full wealth m = sT + M moves with the wage s. Left: labour supply L = T − l. Right: dL/ds split into the substitution term −∂hₗ/∂s ≥ 0 and the endowment income term −L ∂l/∂m ≤ 0. With σ = ½ and M = 0.1 labour peaks at s ≈ 0.19; raise σ to 1 or above and the supply curve stops bending back.</figcaption>
