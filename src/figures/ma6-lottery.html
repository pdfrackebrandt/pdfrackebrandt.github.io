<figure class="nfig" data-nfig="ma6-lottery">
  <div class="nfig-seg" role="group" aria-label="Steady state hours of a worker with divisible labour">
    <button type="button" class="nfig-opt" data-hd="4" aria-pressed="false">h = 1/4, ε = 3</button>
    <button type="button" class="nfig-opt" data-hd="3" aria-pressed="true">h = 1/3, ε = 2</button>
    <button type="button" class="nfig-opt" data-hd="2" aria-pressed="false">h = 1/2, ε = 1</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">shift h̄</span><input type="range" min="0.3" max="0.8" step="0.05" value="0.5" data-k="hbar"><span class="nfig-val" aria-hidden="true">0.50</span></label>
    <label class="nfig-range"><span class="nfig-name">odds π</span><input type="range" min="0" max="1" step="0.01" value="0.6" data-k="pi"><span class="nfig-val" aria-hidden="true">0.60</span></label>
    <label class="nfig-range"><span class="nfig-name">TFP Â, %</span><input type="range" min="-10" max="10" step="0.5" value="0" data-k="tfp"><span class="nfig-val" aria-hidden="true">0.0</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 270" role="group" aria-label="Left: the utility of leisure of one worker, alpha log of one minus h, a concave purple curve, and the red straight chord from working zero hours to working the full shift h bar, which is what a lottery over the two reaches. A draggable red point sits on the chord at h equal to pi times h bar. Right: the labour market in percent deviations from the steady state, with labour demand in blue, the upward sloping purple supply curve of divisible labour and the flat red supply curve of the lottery economy."></svg>
  <p class="fig-note nfig-read" aria-live="polite">π = 0.60, h = πh̄ = 0.30   lottery: −Bh = −0.83   everyone working h: α log(1 − h) = −0.71   B = 2.77
Â = 0.0%, ε = 2.00   divisible: ĥ = 0.00%, ŵ = 0.00%, ĥ/ŵ = 2.00   lottery: ĥ = 0.00%, ŵ = 0</p>
  <figcaption>Left, one worker with α = 2: drag the red point along the chord or move π. With all or nothing work the lottery reaches only the straight line between working 0 and working h̄, so expected utility is linear in hours. Right, with θ = 1/3: move TFP and compare the purple economy, where hours are divisible, with the red lottery economy, where supply is flat and the wage does not move.</figcaption>
</figure>
