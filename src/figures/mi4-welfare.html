<figure class="nfig" data-nfig="mi4-welfare">

    <button type="button" class="nfig-opt" data-pre="ql" aria-pressed="false">Quasilinear</button>
    <button type="button" class="nfig-opt" data-pre="inf" aria-pressed="false">Inferior</button>

  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">new price of good 1 </span>p¹₁</span><input type="range" min="1" max="3.5" step="0.05" value="1" data-k="p"><span class="nfig-val" aria-hidden="true">1.00</span></label>

  <p class="fig-note nfig-read" aria-live="polite">CV = 29.29   ΔCS = 34.66   EV = 41.42
CV ≤ ΔCS ≤ EV: good 1 is normal on this price range; a price fall, so all three are positive</p>
  <figcaption>The three measures as areas between p⁰₁ = 2 and p¹₁, p₂ = 1. Cobb Douglas u = 2√(x₁x₂), w = 100; quasilinear u = 50 ln x₁ + x₂, w = 100, with the same Marshallian demand and no income effect; inferior: the Gorman form above, w = 150. x₁(p, w) crosses h₁(p, u⁰) at the old price and h₁(p, u¹) at the new one, so its area lies between. In All three each band takes the colour of the curve on its outer edge.</figcaption>
