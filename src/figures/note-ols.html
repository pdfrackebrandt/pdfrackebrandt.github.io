<figure class="nfig" data-nfig="ols">
  <div class="fig-controls nfig-bar">

  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 290" tabindex="0" role="group" aria-label="Scatter of 12 points with the OLS fitted line and a vertical residual from each point to the line. Drag any point. With the plot focused, the left and right arrow keys pick a point and the up and down arrow keys move it."></svg>
  <p class="fig-note nfig-read" aria-live="polite">intercept 2.02   slope 0.63   Σe = 0.00   Σxe = 0.00</p>
