<figure class="nfig" data-nfig="mi4-netgross">
  <div class="nfig-seg" role="group" aria-label="Consumer">
    <button type="button" class="nfig-opt" data-pre="cd" aria-pressed="true">Cobb Douglas, w = 100</button>
    <button type="button" class="nfig-opt" data-pre="ql" aria-pressed="false">Quasilinear, w = 4</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.5" max="2" step="0.05" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2 </span>p₂</span><input type="range" min="0.5" max="2" step="0.05" value="1" data-k="p2"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 360" role="img" aria-label="Two panels. Left: demand for good 1 against the price of good 2, Marshallian and Hicksian at the current utility. Right: demand for good 2 against the price of good 1. A dot marks the current prices on each."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p = (1.00, 1.00)   ū = 100.00
gross: x₁ in p₂ = 0.00, x₂ in p₁ = 0.00, gross neutral both ways
net:   s₁₂ = 25.00, s₂₁ = 25.00, symmetric net substitutes
S = [−25.00, 25.00; 25.00, −25.00]   Sp = (0.00, 0.00)</p>
  <figcaption>Net against gross cross effects. Cobb Douglas u = 2√(x₁x₂): x₁ ignores p₂ but h₁ rises with it, so the goods are gross neutral and net substitutes. Quasilinear u = ln x₁ + x₂: the gross slopes differ (1 over p₁ one way, 0 the other) while the net slopes coincide. The readout builds S from Marshallian demand alone and checks Sp = 0.</figcaption>
</figure>
