<figure class="nfig" data-nfig="ma5-saddle">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn ma5-onpath">Saddle path</button>
    <button type="button" class="btn ma5-other">Other root</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 420" role="group" aria-label="Top: the plane of capital k hat across and consumption c hat up, both in percent deviations from the steady state. The blue line is the saddle path c hat equals 0.49 times k hat, the stable root; the dashed line is the other root. A draggable point sets where the economy starts, a red segment shows its gap from the saddle path, and dots trace the next quarters. Bottom: the same path as time series of k hat and c hat over 40 quarters."></svg>
  <p class="fig-note nfig-read" aria-live="polite">k̂₀ = −10.0   ĉ₀ = −2.00   saddle path needs ĉ₀ = 0.492 × k̂₀ = −4.92</p>
  <figcaption>The economy starts with capital k̂₀ percent away from its steady state and no shock. Drag the start point (or focus it and use the arrow keys) to choose consumption ĉ₀. Only starts on the blue saddle path converge; from anywhere else the red gap grows every quarter and capital runs off. The time paths underneath show the same quarters.</figcaption>
</figure>
