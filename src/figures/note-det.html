<figure class="nfig" data-nfig="det">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset to I</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="The columns a1 and a2 of a 2 by 2 matrix A drawn as arrows from the origin, with the parallelogram they span shaded and the unit square dashed for reference. Drag either arrow tip, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">A = [2  0.5; 0.5  1.5]   det A = 2 × 1.5 − 0.5 × 0.5 = 2.75</p>
  <figcaption>Drag the tips of a<sub>1</sub> and a<sub>2</sub>, which snap to a 0.5 grid. The shaded area is |det A|, and it turns red when a<sub>2</sub> passes clockwise of a<sub>1</sub> and det A goes negative. Line the arrows up and the parallelogram flattens to zero area: A is singular.</figcaption>
</figure>
