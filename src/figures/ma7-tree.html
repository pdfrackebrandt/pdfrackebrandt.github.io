<figure class="nfig" data-nfig="ma7-tree">
  <div class="fig-controls nfig-bar">
    <div class="nfig-seg" role="group" aria-label="Dividend path">
      <button type="button" class="nfig-opt" data-mode="news" aria-pressed="true">One good year</button>
      <button type="button" class="nfig-opt" data-mode="path" aria-pressed="false">Random path</button>
    </div>
    <button type="button" class="btn ma7-draw">New draw</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">relative risk aversion </span>σ</span><input type="range" min="0" max="3" step="0.1" value="2" data-k="sigma"><span class="nfig-val" aria-hidden="true">2.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">persistence of dividend growth </span>ρ</span><input type="range" min="0" max="0.6" step="0.05" value="0.4" data-k="rho"><span class="nfig-val" aria-hidden="true">0.40</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 520" role="img" aria-label="Top: the price dividend ratio of the Lucas tree, in percent from its value at z equal to zero, against this year's dividend growth gap z. The dashed grey line at zero is log utility, where the ratio never moves. The blue curve is the chosen sigma: rising for sigma below one, falling above one. Bottom: dividends, dashed, and the tree price, blue, in percent from trend, either after one good year or along a random path."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p/d = 25.77 at z = 0   log utility: β/(1 − β) = 32.33</p>
  <figcaption>A Lucas tree with CRRA utility, β = 0.97, and dividend growth η + z with z = ρz₋₁ + ε, η = 1.8%, s.d. of ε 3.57%. Good news about future fruit raises the cash flows by 1 and lowers what fruit is worth by σ, so the price dividend ratio moves with 1 − σ. Move σ through 1 and watch the two effects cancel.</figcaption>
</figure>
