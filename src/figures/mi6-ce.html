<figure class="nfig" data-nfig="mi6-ce">
  <div class="nfig-seg" role="group" aria-label="Utility">
    <button type="button" class="nfig-opt" data-r="0.5" aria-pressed="true">Concave √x</button>
    <button type="button" class="nfig-opt" data-r="0" aria-pressed="false">Linear x</button>
    <button type="button" class="nfig-opt" data-r="-1" aria-pressed="false">Convex x²</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">relative risk aversion </span>r</span><input type="range" min="-1" max="3" step="0.05" value="0.5" data-k="r"><span class="nfig-val" aria-hidden="true">0.50</span></label>
    <label class="nfig-range"><span class="nfig-name">p on x₂</span><input type="range" min="0.05" max="0.95" step="0.05" value="0.5" data-k="p"><span class="nfig-val" aria-hidden="true">0.50</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 320" role="group" aria-label="A CRRA utility curve over money. The lottery pays x1 or x2; the dashed chord joins the two points on the curve, and its point above the mean x bar is the expected utility. Reading across at that height to the curve and down gives the certainty equivalent C in red. The purple bracket between C and x bar is the risk premium P. Drag x1 and x2 along the axis, or focus one and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">r = 0.50 (ranks like √x)   p = 0.50 on x₂
x̄ = 5.00   u(x̄) > E[u]   C = 4.000   P = x̄ − C = 1.000: risk averse</p>
  <figcaption>Lottery 1 or 9 with probability one half each, under CRRA utility with curvature r (r = 0.5 ranks like √x, r = 0 is linear, r = −1 ranks like x²). Concave: C = 4 &lt; 5, P = 1. Linear: C = 5, P = 0. Convex: C = 6.40 &gt; 5, P = −1.40. The vertical axis is rescaled so that u(x₁) and u(x₂) stay put. Drag the prizes and move r and p.</figcaption>
</figure>
