<figure class="nfig" data-nfig="gt1-strategies">
  <svg class="nfig-plot" viewBox="0 0 520 400" role="group" aria-label="Cheating hide and seek: Ana chooses H or T, and Bob, who sees her move, chooses h or t at his information set I1 after H, drawn red, and at I2 after T, drawn purple. Next to the tree, the two by four normal form with Ana's rows H and T and Bob's columns hh, th, ht, tt. Branches and cells are buttons: a branch sets that action, a cell sets Ana's row and Bob's whole strategy. The chosen column shows its entry against H in red and against T in purple."></svg>
  <p class="fig-note nfig-read" aria-live="polite">Bob plays ht: h at I₁ (after H), t at I₂ (after T); he seeks where Ana is.

Ana plays H: outcome (−1, 1).</p>
  <figcaption>Bob peeks, so he has two information sets, I₁ after H (red) and I₂ after T (purple), and a strategy is a pair of actions, one at each. Click his branches or a column. The plan’s column of the normal form lists what it yields against H (red entry, through I₁) and against T (purple entry, through I₂); Ana’s choice picks the row and the shaded path. The plan ht always finds Ana.</figcaption>
