<figure class="nfig" data-nfig="ma10-ge">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">banker </span>net worth N</span><input type="range" min="0" max="1" step="0.01" value="0.5" data-k="n"><span class="nfig-val" aria-hidden="true">0.50</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">relative risk aversion </span>γ</span><input type="range" min="1" max="5" step="0.1" value="2" data-k="gamma"><span class="nfig-val" aria-hidden="true">2.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 420" role="img" aria-label="Consumption today c1 across and tomorrow c2 up. The grey resource line c2 equals theta bar times y plus e N minus c1 is the same for the market and the planner. The green first best point is where an indifference curve is tangent to it, with slope theta bar. The blue market point lies further down and right on the same line, where the household's indifference curve is tangent to the dashed blue line of slope R, the return it sees. Dotted guides show c1 above and c2 below the first best."></svg>
  <p class="fig-note nfig-read" aria-live="polite">R = θ̄/(2 − N) = 1.000 &lt; θ̄ = 1.5   c₁ = 0.909 vs c₁* = 0.835   c₂ = 0.886 vs c₂* = 0.997
investment ep̄ = 0.591 vs ep* = 0.665, 11.1% short   welfare loss: 1.01% of first best consumption in both periods
deposits d = y − c₁ = 0.091   both points lie on the same resource line: only the slope households face differs</p>
  <figcaption>The economy turns each unit saved into θ̄ = 1.5 of consumption tomorrow, in the market and for the planner alike (β = 0.95, y = e = 1). The planner saves until the marginal rate of substitution equals θ̄; households stop where it equals R, which is below θ̄. Raise N to close the gap, or raise γ to make saving less sensitive to its return.</figcaption>
</figure>
