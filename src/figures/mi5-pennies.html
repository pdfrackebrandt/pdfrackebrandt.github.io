<figure class="nfig" data-nfig="mi5-pennies">
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Transformation f of every payoff">
    <button type="button" class="nfig-opt" data-tf="id" aria-pressed="true">f(t) = t</button>
    <button type="button" class="nfig-opt" data-tf="aff" aria-pressed="false">3 + 2t</button>
    <button type="button" class="nfig-opt" data-tf="exp" aria-pressed="false">eᵗ</button>
    <button type="button" class="nfig-opt" data-tf="cube" aria-pressed="false">t³</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">payoff to A at Heads, Heads: </span>h</span><input type="range" min="1" max="3" step="0.25" value="2" data-k="h"><span class="nfig-val" aria-hidden="true">2.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 300" role="img" aria-label="The payoff matrix of matching pennies with A's payoff at (Heads, Heads) equal to h, after a transformation f of every payoff. Beside it, A's expected payoff from Heads and from Tails as straight lines in q, the probability that B plays Heads. They cross at q star, the mix of B that makes A indifferent. B's own mix p star stays at one half."></svg>
  <p class="fig-note nfig-read" aria-live="polite">A: Heads pays 2.00 or −1.00, Tails pays −1.00 or 1.00
q* = [f(1) − f(−1)] ÷ [f(h) + f(1) − 2f(−1)] = 2.000 ÷ 5.000 = 0.400   p* = 0.500</p>
  <figcaption>A's indifference condition: the lines are A's expected payoff from Heads and from Tails against q, B's chance of Heads, and they cross at B's equilibrium mix q*. With h = 1 the payoffs take two values and q* = ½ under every increasing f. With h = 2 they take three: q* = 0.4 under f(t) = t and any affine f, 0.251 under f(t) = exp(t). Move h and switch f.</figcaption>
</figure>
