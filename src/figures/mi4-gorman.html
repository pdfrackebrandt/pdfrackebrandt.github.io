<figure class="nfig" data-nfig="mi4-gorman">
  <div class="nfig-seg" role="group" aria-label="Pair of consumers">
    <button type="button" class="nfig-opt" data-pre="same" aria-pressed="true">Same slope</button>
    <button type="button" class="nfig-opt" data-pre="diff" aria-pressed="false">Different slopes</button>
    <button type="button" class="nfig-opt" data-pre="corner" aria-pressed="false">Corner</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth of consumer i before the transfer, </span>wᵢ</span><input type="range" min="0" max="10" step="0.5" value="6" data-k="wi"><span class="nfig-val" aria-hidden="true">6.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth of consumer j before the transfer, </span>wⱼ</span><input type="range" min="0" max="10" step="0.5" value="4" data-k="wj"><span class="nfig-val" aria-hidden="true">4.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">transfer from i to j, </span>τ</span><input type="range" min="0" max="4" step="0.5" value="2" data-k="tau"><span class="nfig-val" aria-hidden="true">2.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 380" role="img" aria-label="Two panels. Left: the Engel curves of consumers i and j for one good, with arrows from each consumer's demand before the transfer to after it. Right: aggregate demand against the wealth of i with total wealth fixed, with an arrow for the same transfer."></svg>
  <p class="fig-note nfig-read" aria-live="polite">transfer 2.0 from i (6.0 → 4.0) to j (4.0 → 6.0), total 10.0 fixed
Δx = Δxᵢ + Δxⱼ = −1.00 + 1.00 = 0.00: aggregate unchanged
wealth effects on the moved range: i 0.50, j 0.50, equal</p>
  <figcaption>A transfer τ from i to j, prices fixed. Same slope: parallel linear Engel curves, so the aggregate is flat in the split and does not move. Different slopes: two Cobb Douglas consumers, the aggregate falls. Corner: Gorman lines where i stops at zero consumption, so aggregation fails below the kink at wᵢ = 4. Hollow dots mark demand before the transfer, filled dots after.</figcaption>
</figure>
