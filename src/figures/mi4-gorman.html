<figure class="nfig" data-nfig="mi4-gorman">
  <div class="nfig-seg" role="group" aria-label="Pair of consumers">
    <button type="button" class="nfig-opt" data-pre="gor" aria-pressed="true">Same slope</button>
    <button type="button" class="nfig-opt" data-pre="cd" aria-pressed="false">Different slopes</button>

  <svg class="nfig-plot" viewBox="0 0 520 380" role="img" aria-label="Top: the Engel curves for good 1 of two consumers, demand against wealth, with a dot at each one's wealth. Bottom: aggregate demand for good 1 against consumer 1's wealth when total wealth is fixed at 20."></svg>
  <p class="fig-note nfig-read" aria-live="polite">w₁ = 10.0, w₂ = 10.0:   X₁ = 3.50 + 1.50 = 5.00
