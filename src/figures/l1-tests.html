<figure class="nfig" data-nfig="l1-tests">
  <div class="nfig-seg" role="group" aria-label="Distribution">
    <button type="button" class="nfig-opt" data-dist="chi" aria-pressed="false">Chi squared</button>
    <button type="button" class="nfig-opt" data-dist="t" aria-pressed="true">Student t</button>
    <button type="button" class="nfig-opt" data-dist="f" aria-pressed="false">F</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">degrees of freedom </span><span class="l1-nm">n</span></span><input type="range" min="1" max="30" step="1" value="3" data-k="n"><span class="nfig-val" aria-hidden="true">3</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">denominator degrees of freedom </span>p</span><input type="range" min="1" max="30" step="1" value="10" data-k="p"><span class="nfig-val" aria-hidden="true">10</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 290" role="img" aria-label="Histogram of 4000 draws built from independent standard normals, scaled as a density, with the exact density of the chosen distribution drawn on top. In the t view the standard normal density is drawn for comparison."></svg>
  <p class="fig-note nfig-read" aria-live="polite">n = 3: P(|T| &gt; 2) = 0.139 against 0.046 under N(0, 1); variance n/(n − 2) = 3.00
share of the 4000 draws beyond ±2: 0.143</p>
  <figcaption>The bars are 4000 draws built literally from standard normals: a sum of n squares for chi squared, Z divided by the root of an independent chi squared over n for t, and a ratio of two scaled independent chi squared for F. The blue curve is the exact density. In t, start at n = 1 and slide right: the tails thin out and the curve settles onto N(0, 1). In F, set m = 1: each draw is the square of a t draw, so P(F &gt; 4) = P(|T| &gt; 2).</figcaption>
</figure>
