<figure class="nfig" data-nfig="ma3-tfp">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">new TFP </span>ε′</span><input type="range" min="1" max="1.6" step="0.01" value="1.6" data-k="eps"><span class="nfig-val" aria-hidden="true">1.60</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">inverse elasticity of intertemporal substitution </span>σ</span><input type="range" min="0.05" max="4" step="0.01" value="2" data-k="sigma"><span class="nfig-val" aria-hidden="true">2.00</span></label>

  <svg class="nfig-plot" viewBox="0 0 520 480" role="img" aria-label="Phase diagram for an unexpected permanent rise in TFP from 1 to epsilon prime. Old loci are dashed, new loci solid. Both steady states lie on the purple dotted ray through the origin. Consumption jumps from the old steady state onto the new red saddle path, up when sigma is above alpha and down when it is below, then rises with capital to the new steady state. The panel below shows c and k over time as a percentage of the old steady state."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ε′ = 1.30: k* and c* both scale by 1.455</p>
