<figure class="nfig" data-nfig="ma11-contract">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">cutoff </span>ω̄</span><input type="range" min="0.05" max="2" step="0.01" value="0.5" data-k="wbar"><span class="nfig-val" aria-hidden="true">0.50</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">monitoring cost </span>μ</span><input type="range" min="0" max="0.6" step="0.01" value="0.1" data-k="mu"><span class="nfig-val" aria-hidden="true">0.10</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">dispersion of log productivity </span>σ</span><input type="range" min="0.15" max="0.8" step="0.01" value="0.37" data-k="sigma"><span class="nfig-val" aria-hidden="true">0.37</span></label>
  </div>
  <svg class="nfig-plot nfig-drag" viewBox="0 0 520 420" role="group" aria-label="The standard debt contract. Top panel: productivity omega across, payoff per unit of the banker's gross return up. The dashed diagonal is output omega. The teal line is what lenders get: one minus mu times omega below the red cutoff omega bar, where they monitor and the orange wedge mu omega is burned, and the flat amount omega bar above it. The purple line is the banker's payoff, zero below the cutoff and omega minus omega bar above it. Middle panel: the lognormal density of omega with mean 1; the red area left of the cutoff is the default probability F of omega bar. Bottom: a bar splitting expected output into the banker's share one minus Gamma, the lenders' share Gamma minus mu G, and the monitoring loss mu G. Drag in either panel or use the slider to move the cutoff."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ω̄ = 0.50: F(ω̄) = 4.6% of bankers default   G(ω̄) = 0.0198   Γ(ω̄) = 0.4970
banker 1 − Γ = 0.5030   lenders Γ − μG = 0.4950   monitoring μG = 0.0020</p>
  <figcaption>One debt contract, per unit of the banker's gross return. Above the red cutoff ω̄ the banker repays and keeps the rest; below it the banker is bankrupt, lenders monitor, recover 1 − μ of what is left, and the orange wedge is burned. The density below shows how many bankers land on each side. Drag the cutoff and watch the default share F(ω̄), the shares Γ and 1 − Γ, and how small the monitoring loss μG stays.</figcaption>
</figure>
