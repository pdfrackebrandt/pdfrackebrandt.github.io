<figure class="nfig" data-nfig="mi9-box">
  <div class="nfig-seg" role="group" aria-label="View">
    <button type="button" class="nfig-opt" data-mode="market" aria-pressed="true">Market equilibrium E</button>
    <button type="button" class="nfig-opt" data-mode="support" aria-pressed="false">Supporting F with transfers</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="The Edgeworth box of size 8 by 6 with a's origin at the bottom left and b's at the top right. The contract curve x2 equals 9 x1 over x1 plus 4 runs between the origins. Market view: a draggable endowment omega, the equilibrium budget line through it, the equilibrium E on the contract curve with the indifference curves of a in teal and b in orange through it, and the point F. Transfers view: F can be dragged along the contract curve; the price line through F, the parallel line through omega, and arrows for the transfer of good 2 or of good 1 that moves the endowment onto F's price line, green when feasible and red when it would leave b with a negative amount."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ωᵃ = (4.0, 2.0), ωᵇ = (4.0, 4.0)   p₁/p₂ = 0.500
E: xᵃ = (2.00, 3.00), xᵇ = (6.00, 3.00), on the contract curve
E against F = (5.00, 5.00): a finds E worse, b finds E better: neither ranks the other</p>
  <figcaption>The box economy: a has u = ln x₁ + 3 ln x₂, b has u = ln x₁ + ln x₂, and ω̄ = (8, 6). Market: drag the endowment ω; the budget line through ω picks the equilibrium E on the contract curve, with the indifference curves of a (teal) and b (orange) through it, and E and F = (5, 5) are never ranked against each other. Transfers: drag F along the contract curve or move ω. F is supported at the price ratio equal to the common MRS, one third at F = (5, 5); moving 10 thirds of a unit of good 2 from b to a puts ω on the price line through F, while the transfer of good 1 that would do it is 10 units, more than b owns.</figcaption>
</figure>
