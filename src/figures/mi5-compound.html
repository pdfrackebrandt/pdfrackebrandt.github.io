<figure class="nfig" data-nfig="mi5-compound">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn mi5-ex">Example</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">weight on L1, </span>α</span><input type="range" min="0" max="1" step="0.01" value="0.3" data-k="a"><span class="nfig-val" aria-hidden="true">0.30</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Two simple lotteries L1 and L2 are draggable points in the probability triangle. The compound lottery that plays L1 with probability alpha and L2 otherwise reduces to the red point on the segment between them, alpha L1 plus (1 minus alpha) L2. A tree beside the triangle shows the two stages and the reduced probabilities. Example loads the two compound lotteries of the worked example, which reduce to the same point."></svg>
  <p class="fig-note nfig-read" aria-live="polite">0.30 × (0.600, 0.200, 0.200) + 0.70 × (0.100, 0.300, 0.600)
= (0.250, 0.270, 0.480)</p>
  <figcaption>Mixing lotteries is averaging points. The tree is the compound lottery: a first draw picks L₁ with probability α and L₂ otherwise, then the chosen lottery picks the prize. The red point is the reduced lottery, pₙ = αpₙ¹ + (1 − α)pₙ², which splits the segment in the ratio 1 − α to α. Drag L₁ and L₂, move α, or press Example for two different trees with one reduced lottery.</figcaption>
</figure>
