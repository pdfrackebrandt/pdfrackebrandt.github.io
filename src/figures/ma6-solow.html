<figure class="nfig" data-nfig="ma6-solow">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn ma6-show" aria-pressed="false">Show the cheapest wage</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">outside option x</span><input type="range" min="0.5" max="1.2" step="0.05" value="1" data-k="x"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name">β</span><input type="range" min="0.2" max="0.7" step="0.05" value="0.5" data-k="beta"><span class="nfig-val" aria-hidden="true">0.50</span></label>
    <label class="nfig-range"><span class="nfig-name">productivity A</span><input type="range" min="0.8" max="1.2" step="0.01" value="1" data-k="A"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 290" role="group" aria-label="The effort curve e of w, zero up to the outside option x and rising and concave above it. A draggable purple point on the curve carries a purple ray from the origin whose slope is effort per unit of pay. The ray is steepest where it is tangent to the curve, at the cheapest wage w star, shown in green on request."></svg>
  <p class="fig-note nfig-read" aria-live="polite">w = 3.00   e(w) = 1.41   cost per unit of effort w/e = 2.12   elasticity w e′/e = 0.75
employment index 100.0 at the cheapest wage, A = 1.00</p>
  <figcaption>Effort e(w) = ((w − x)/x)^β above the outside option x. Drag the purple point: the slope of its ray is effort per unit of pay, and the firm wants it as steep as possible. Employment is an index for production A(eL)^(1/2), 100 at the starting values.</figcaption>
</figure>
