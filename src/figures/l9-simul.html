<figure class="nfig" data-nfig="l9-simul">
  <div class="fig-controls nfig-bar">
    <div class="nfig-sliders">
      <label class="nfig-range"><span class="nfig-name">sd of investment I</span><input type="range" min="0" max="0.5" step="0.05" value="0.4" data-k="si"><span class="nfig-val" aria-hidden="true">0.40</span></label>
      <label class="nfig-range"><span class="nfig-name">sd of shock u</span><input type="range" min="0" max="0.5" step="0.05" value="0.3" data-k="su"><span class="nfig-val" aria-hidden="true">0.30</span></label>
      <label class="nfig-range"><span class="nfig-name">slope β</span><input type="range" min="0.3" max="0.7" step="0.05" value="0.6" data-k="b"><span class="nfig-val" aria-hidden="true">0.60</span></label>
    </div>
    <button type="button" class="btn nfig-new">New sample</button>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 448" role="img" aria-label="Scatter of 200 equilibrium points of income Y and consumption C from Haavelmo's model. The red line is the consumption function C = α + βY, the green line is the income identity C = Y − E[I] with slope 1, and the wide grey line is the OLS fit of C on Y. Dashed lines show the consumption function shifted by the shock u and the identity shifted by investment I for five marked observations; each point is the crossing of its own two shifted lines. With both shocks active the OLS line lies between the red and the green line."></svg>
  <p class="fig-note nfig-read" aria-live="polite">β = 0.60   sd(I) = 0.40   sd(u) = 0.30   N = 200
OLS slope of C on Y in this sample: 0.732
its plim (β Var(I) + Var(u)) ÷ (Var(I) + Var(u)): 0.744   plim − β = 0.144
Cov(Y, u) = Var(u) ÷ (1 − β) = 0.225
Both move: OLS estimates neither slope, a weighted average of β and 1.</p>
  <figcaption>Each point solves Cᵢ = α + βYᵢ + uᵢ and Yᵢ = Cᵢ + Iᵢ at once, with Iᵢ and uᵢ independent normals, E[I] = 2 and α = 8 − 10β so the mean equilibrium stays at (10, 8). Set the sd of u to 0: only the identity shifts and the points trace the consumption function. Set the sd of I to 0 instead: only the consumption function shifts and the points trace the identity. With both shocks OLS recovers neither line, because Y moves with u.</figcaption>
</figure>
