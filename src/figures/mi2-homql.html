<figure class="nfig" data-nfig="mi2-homql">
  <div class="nfig-seg" role="group" aria-label="Utility function">
    <button type="button" class="nfig-opt" data-fam="cd" aria-pressed="true">√(x₁x₂)</button>
    <button type="button" class="nfig-opt" data-fam="ql" aria-pressed="false">x₁ + 3√x₂</button>
    <button type="button" class="nfig-opt" data-fam="sub" aria-pressed="false">x₁ + 2x₂</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="0.5" max="10" step="0.25" value="6" data-k="w"><span class="nfig-val" aria-hidden="true">6.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2, with p1 = 1, </span>p₂</span><input type="range" min="0.5" max="3" step="0.05" value="1" data-k="p2"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 720" role="group" aria-label="Left or top: the indifference map with a draggable bundle x, the dashed ray through x and the dashed horizontal line through x. Short tangent pieces sit at x in blue, at scaled bundles alpha x on the ray in purple and at shifted bundles x + t e1 on the line in green. Right or below: the budget line at p = (1, p2) and wealth w, the optimum x star, and the expansion paths of x star as w grows for Cobb Douglas, quasilinear and perfect substitutes, the chosen one strong."></svg>
  <p class="fig-note nfig-read" aria-live="polite">√(x₁x₂), homothetic: MRS at x = (2.00, 4.00) is 2.00
along the ray through x: the same MRS at every αx shown
along the line x + te₁: MRS from 0.80 to 8.00
p = (1, 1.00), w = 6.00: x* = (3.00, 3.00); the path is a ray, x₂/x₁ = p₁/p₂ at every w</p>
  <figcaption>Homothetic: equal slopes along rays (purple). Quasilinear: equal slopes along horizontal lines (green). Perfect substitutes have both. Second panel: expansion paths at p = (1, p₂) as w grows, a ray for Cobb Douglas against a corner on good 2 and then a horizontal line at x₂* for the quasilinear map. Drag x, move w and p₂.</figcaption>
</figure>
