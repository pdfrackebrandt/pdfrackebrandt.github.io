  <svg class="nfig-plot" viewBox="0 0 520 290" role="img" aria-label="The value of depositing against the probability pi of a run, as the gain over autarky in percent of certain consumption. The blue line starts at the gain from the optimal deposit contract and falls as the run probability rises; it crosses zero, the autarky level, at the threshold run probability, marked by a dashed line. A lower floor makes the line fall faster."></svg>
  <p class="fig-note nfig-read" aria-live="polite">floor = 0.20   expected utility: optimum −0.7172, autarky −0.7250, run −1.4272   run probability threshold 1.10%

  <figcaption>t = 0.25, R = 1.5, ρ = 0.95. The deposit contract against autarky when a run happens with probability π. Welfare is shown as the certain consumption that gives the same expected utility. The ex ante condition puts u(0) on the losers of the run lottery; with γ &gt; 1 that is −∞, so here the losers keep a small floor instead. Lower the floor and watch the threshold collapse towards zero.</figcaption>
