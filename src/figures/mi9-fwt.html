<figure class="nfig" data-nfig="mi9-fwt">
  <div class="nfig-seg" role="group" aria-label="Preferences of a">
    <button type="button" class="nfig-opt" data-mode="lns" aria-pressed="true">Locally nonsatiated</button>
    <button type="button" class="nfig-opt" data-mode="nolns" aria-pressed="false">Thick indifference set, no LNS</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="The 8 by 6 Edgeworth box. With locally nonsatiated preferences: the equilibrium E for a draggable endowment omega, the set of allocations a strictly prefers to E shaded teal above a's indifference curve, the set b strictly prefers shaded orange below b's, and the price line through E between them. A draggable test allocation shows which agent gains. Without LNS: a's utility is the minimum of x1 plus x2 and 4, so everything on or above the line x1 plus x2 equals 4 is one thick indifference set, shaded grey; at p equal to 1 and 1 the endowment (4, 2) is the equilibrium, and the test allocation (3, 2) keeps a at 4 while raising b."></svg>
  <p class="fig-note nfig-read" aria-live="polite">E = (2.00, 3.00) at p₁/p₂ = 0.500, m_a = p·ωᵃ = 4.00
xᵃ = (5.0, 2.5): better for a, worse for b than E
p·xᵃ − m_a = 1.00 &gt; 0: xᵇ costs less than m_b, so b is worse off</p>
  <figcaption>First option: at E the price line separates the allocations a strictly prefers (teal, above) from those b strictly prefers (orange, below), so no point is better for both; drag ω to move E and drag a's bundle to test any allocation. Second option: a's utility is min{x₁ + x₂, 4}, so the bundles with x₁ + x₂ ≥ 4 form one thick indifference set (grey); the equilibrium is E = ω at p = (1, 1), and moving one unit of good 1 from a to b, so that a holds (3, 2), is a Pareto improvement.</figcaption>
</figure>
