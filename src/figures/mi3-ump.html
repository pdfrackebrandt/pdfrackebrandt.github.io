<figure class="nfig" data-nfig="mi3-ump">
  <div class="fig-controls nfig-bar">
    <div class="nfig-seg" role="group" aria-label="Preferences">
      <button type="button" class="nfig-opt" data-pref="cd" aria-pressed="true">Cobb Douglas</button>
      <button type="button" class="nfig-opt" data-pref="ql" aria-pressed="false">Quasilinear, slide 46</button>
    </div>
    <button type="button" class="btn mi3-toopt">Go to the optimum</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.5" max="4" step="0.1" value="2" data-k="p1"><span class="nfig-val" aria-hidden="true">2.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="0.5" max="16" step="0.5" value="12" data-k="w"><span class="nfig-val" aria-hidden="true">12.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 300" role="group" aria-label="The budget line with p2 = 1, the optimal bundle x star with its indifference curve, and a draggable bundle on the budget line with the dashed indifference curve through it. The purple segment at the bundle has the slope of that indifference curve, minus the MRS. Drag the bundle, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">at x = (2.00, 8.00): MRS = u₁/u₂ = 4.00 &gt; p₁/p₂ = 2.00
u₁/p₁ = 0.500 &gt; u₂/p₂ = 0.250: move spending to good 1
optimum x* = (3.00, 6.00)   v = 4.24   λ = u₁/p₁ = 0.354</p>
  <figcaption>Utility u = √(x₁x₂) or the quasilinear u = ln x₁ + x₂ of slide 46, with p₂ = 1. Drag the bundle along the budget line: where the purple slope of its indifference curve is steeper than the budget line, good 1 is worth more than it costs.</figcaption>
</figure>
