<figure class="nfig" data-nfig="mi3-ump">
  <div class="fig-controls nfig-bar">
    <div class="nfig-seg" role="group" aria-label="Preferences">
      <button type="button" class="nfig-opt" data-pref="ql" aria-pressed="true">ln x₁ + x₂</button>
      <button type="button" class="nfig-opt" data-pref="cd" aria-pressed="false">Cobb Douglas √(x₁x₂)</button>
    </div>
    <button type="button" class="btn mi3-toopt">Go to the optimum</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.2" max="3" step="0.05" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2 </span>p₂</span><input type="range" min="0.2" max="3" step="0.05" value="2" data-k="p2"><span class="nfig-val" aria-hidden="true">2.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="0.5" max="10" step="0.1" value="6" data-k="w"><span class="nfig-val" aria-hidden="true">6.0</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 520" role="group" aria-label="Top: commodity space with the budget line, the optimal bundle x star and its indifference curve, and a draggable bundle on the budget line with a purple segment showing the slope of its own indifference curve. Bottom: price space with dotted level sets of indirect utility, the solid level set through the price vector p, the shaded set of prices where v is at most v of p, and a dashed segment from p to a second draggable price vector q. Drag the bundle, p or q, or focus one and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">at x = (4.00, 1.00): MRS = u₁/u₂ = 0.25 &lt; p₁/p₂ = 0.50
u₁/p₁ = 0.250 &lt; u₂/p₂ = 0.500: move spending to good 2
optimum x* = (2.00, 2.00)   v = 2.69   λ = u₁/p₁ = 0.500</p>
  <figcaption>Top: u = ln x₁ + x₂ (or √(x₁x₂)) on the budget line. Drag the bundle: where the purple slope of its indifference curve is steeper than the budget line, good 1 is worth more than it costs. Push w down to p₂ or below and the optimum jumps to the corner x₂ = 0, where a pound buys less utility in good 2 than in good 1. Bottom: the level sets of v(p, w) in price space. The shaded lower level set through p is convex: drag p and q, and v on the segment between them never exceeds the larger of v(p) and v(q).</figcaption>
</figure>
