    <label class="nfig-range"><span class="nfig-name">P(X &gt; 0)</span><input type="range" min="0.1" max="0.9" step="0.05" value="0.5" data-k="s"><span class="nfig-val" aria-hidden="true">0.50</span></label>

  <svg class="nfig-plot" viewBox="0 0 520 290" role="img" aria-label="The four points of X uniform on minus 2, minus 1, 1 and 2 with Y equal to X squared, drawn as dots whose areas are their probabilities, on the parabola Y equals X squared. A dashed line is the best linear fit of Y on X, and green rings on the levels Y = 1 and Y = 4 mark the conditional means of X given Y. The slider moves probability between the negative and the positive values of X."></svg>
