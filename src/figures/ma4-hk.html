<figure class="nfig" data-nfig="ma4-hk">
  <div class="nfig-seg" role="group" aria-label="Model">
    <button type="button" class="nfig-opt" data-sec="one" aria-pressed="true">One sector, slides 15 to 19</button>
    <button type="button" class="nfig-opt" data-sec="two" aria-pressed="false">Two sectors, slides 20 to 25</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">capital share </span>α</span><input type="range" min="0.2" max="0.8" step="0.05" value="0.3" data-k="alpha"><span class="nfig-val" aria-hidden="true">0.30</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">technology of the human capital sector </span>B</span><input type="range" min="0.05" max="0.6" step="0.01" value="0.2" data-k="b"><span class="nfig-val" aria-hidden="true">0.20</span></label>
  </div>
  <svg class="nfig-plot nfig-drag" viewBox="0 0 520 318" tabindex="0" role="slider" aria-label="Returns to physical and human capital, in goods, against the ratio H over K on a log scale, with A = 0.2. The return on K rises with H over K and the return on H falls; they cross at the ratio the household chooses. A dashed line marks delta plus rho. Drag across the plot or use the arrow keys to move the probe."></svg>
  <p class="fig-note nfig-read" aria-live="polite">(H/K)* = (1 − α)/α = 2.33   r = 0.109   output Y = 0.362K   growth r − δ − ρ = 2.86%
at H/K = 1.00: return on K 0.060 &lt; return on H 0.140: add human capital</p>
  <figcaption>Returns in goods per unit of capital a year, with A = 0.2, δ = 0.05 and ρ = 0.03. In one sector both capitals are made from goods one for one; in two sectors human capital is made with technology B and costs p = A/B goods, so its return is its marginal product divided by p. Drag across the plot to move the probe; the purple dot is where the two returns are equal.</figcaption>
</figure>
