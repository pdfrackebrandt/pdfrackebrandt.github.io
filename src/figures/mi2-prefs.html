<figure class="nfig" data-nfig="mi2-prefs">
  <div class="nfig-seg mi2-seg3" role="group" aria-label="Preference">
    <button type="button" class="nfig-opt" data-fam="min" aria-pressed="true">min{x₁, x₂}</button>
    <button type="button" class="nfig-opt" data-fam="sum" aria-pressed="false">x₁ + x₂</button>
    <button type="button" class="nfig-opt" data-fam="bliss" aria-pressed="false">bliss point</button>
    <button type="button" class="nfig-opt" data-fam="sq" aria-pressed="false">x₁² + x₂²</button>
    <button type="button" class="nfig-opt" data-fam="sqrt" aria-pressed="false">√x₁ + √x₂</button>
    <button type="button" class="nfig-opt" data-fam="thick" aria-pressed="false">thick band</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">distance of z along the indifference curve, </span>z along I(x)</span><input type="range" min="-8" max="8" step="0.25" value="3" data-k="d"><span class="nfig-val" aria-hidden="true">3.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="An indifference map on the square from 0 to 8 in both goods. The shading is the upper contour set U(x) of the purple bundle x, and the solid curve is the indifference curve I(x). Two arrows show a small step right and a small step up and right, green if better, grey if no better, red if worse. A green bundle z lies on I(x) at the distance set by the slider, and the orange point m is the midpoint of x and z. Drag x, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">x = (2.00, 2.00)   u(x) = 2.00
a little more good 1: no better   a little more of both: better   a better bundle nearby: yes
z = (5.00, 2.00) on I(x), midpoint m = (3.50, 2.00): m ∼ x, so m ∈ U(x)
min{x₁, x₂}: weakly monotone, not strongly; convex, not strictly</p>
  <figcaption>The five preferences of the table, and a thick indifference band. Arrows test monotonicity: a small step right, and a small step up and right, from x. The shading is U(x); slide z along I(x) and watch the midpoint m: convexity requires m ∈ U(x). Lines and L shapes leave m on the curve, circles about a bliss point and √x₁ + √x₂ put it strictly inside, and x₁² + x₂² puts it outside.</figcaption>
</figure>
