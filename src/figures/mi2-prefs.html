<figure class="nfig" data-nfig="mi2-prefs">
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Preference">
    <button type="button" class="nfig-opt" data-fam="min" aria-pressed="true">min{x₁, x₂}</button>
    <button type="button" class="nfig-opt" data-fam="sum" aria-pressed="false">x₁ + x₂</button>
    <button type="button" class="nfig-opt" data-fam="bliss" aria-pressed="false">Bliss point</button>
    <button type="button" class="nfig-opt" data-fam="thick" aria-pressed="false">Thick band</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="An indifference map on the square from 0 to 8 in both goods. The shading is the upper contour set of the purple bundle x, the solid curve is the indifference curve through x, and two arrows show a small step to the right and a small step up and to the right, coloured green if the step is better, grey if it is no better and red if it is worse. Drag x, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">x = (2.00, 5.00)   u(x) = 2.00
a little more good 1: better   a little more of both: better   a better bundle nearby: yes
min{x₁, x₂}: weakly monotone but not strongly; locally nonsatiated everywhere</p>
  <figcaption>Pick a preference and drag the purple bundle x. The shading is the upper contour set U(x), the solid curve is the indifference curve through x, and the arrows are small steps from x: green if better, grey if no better, red if worse.</figcaption>
</figure>
