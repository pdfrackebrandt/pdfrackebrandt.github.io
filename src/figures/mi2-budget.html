<figure class="nfig" data-nfig="mi2-budget">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn mi2-dbl">Double p and w</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.5" max="5" step="0.25" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2 </span>p₂</span><input type="range" min="0.5" max="5" step="0.25" value="2" data-k="p2"><span class="nfig-val" aria-hidden="true">2.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="2" max="20" step="0.5" value="8" data-k="w"><span class="nfig-val" aria-hidden="true">8.0</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="The budget set for two goods: the shaded triangle of bundles with p1 x1 + p2 x2 at most w, bounded by the budget line from w/p2 on the x2 axis to w/p1 on the x1 axis. A dashed line marks the starting budget, p = (1, 2) and w = 8. A purple point is a bundle x you can drag, or focus and move with the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p = (1.00, 2.00)   w = 8.0   w/p₁ = 8.00   w/p₂ = 4.00   slope −p₁/p₂ = −0.50
x = (4.00, 1.50)   p·x = 7.00 ≤ w: affordable</p>
  <figcaption>The shaded triangle is the budget set B(p, w), and the dashed line is the starting budget, p = (1, 2) and w = 8. Move the prices and wealth, or press Double p and w, and drag the purple bundle x to see when it is affordable.</figcaption>
</figure>
