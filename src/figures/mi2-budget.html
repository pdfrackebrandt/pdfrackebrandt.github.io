<figure class="nfig" data-nfig="mi2-budget">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.5" max="5" step="0.25" value="2" data-k="p1"><span class="nfig-val" aria-hidden="true">2.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2 </span>p₂</span><input type="range" min="0.5" max="5" step="0.25" value="1" data-k="p2"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="2" max="20" step="0.5" value="12" data-k="w"><span class="nfig-val" aria-hidden="true">12.0</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">scale prices and wealth by </span>k</span><input type="range" min="0.25" max="4" step="0.25" value="1" data-k="k"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="The budget set for two goods at prices kp and wealth kw, against a dashed reference budget with p = (2, 1) and w = 8. Bundles in both sets are shaded blue, bundles gained are green and bundles lost are orange. A purple point is a bundle x you can drag, or focus and move with the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p = (2.00, 1.00)   w = 12.0
w/p₁ = 6.00   w/p₂ = 12.00   slope −p₁/p₂ = −2.00
against the dashed budget p = (2, 1), w = 8: B(p, w) contains it, gains only
x = (4.00, 2.00)   p·x = 10.00 ≤ w: affordable</p>
  <figcaption>The budget set B(p, w) against the dashed budget p = (2, 1), w = 8: green is gained, orange is lost. Raise w and the line shifts out in parallel; raise p₁ and it pivots about w/p₂. Moving k scales all prices and wealth together and changes nothing: only relative prices and real wealth matter. Drag x to test affordability.</figcaption>
</figure>
