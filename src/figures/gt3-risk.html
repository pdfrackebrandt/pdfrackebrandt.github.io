    <button type="button" class="nfig-opt" data-mode="all" aria-pressed="false">all beliefs</button>
    <button type="button" class="nfig-opt" data-mode="near1" aria-pressed="false">p near 1</button>

  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 310" role="group" aria-label="Player 2's expected payoffs from t1, t2, t3 and t4 against her belief p, the probability that player 1 plays s1, with a strip under the axis coloured by her best response. Drag along the axis to move p; the three buttons zoom to p near 0, all beliefs, or p near 1."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p = 0.0100:  u₂(t₁) = −9899.9,  u₂(t₂) = −989.9,  u₂(t₃) = 3.0,  u₂(t₄) = 9.8
best response t₄; player 1's best reply to t₄ is s₂, so the correct belief is p = 0
at p = 0 player 2 still plays t₄: (s₂, t₄) is a Nash equilibrium</p>
  <figcaption>Drag player 2's belief p, the probability of s₁. The equilibrium strategy t₄ (red) beats the safe t₃ (purple) only while p is below 1 in 60; t₁ (orange) wins only above 9000 in 9001, and t₂ only just below that. The strip under the axis shows that t₃ is the best response for almost every belief, yet against t₃ player 1 plays s₂, and then player 2 would switch to t₄: the plausible outcome (s₂, t₃) is not an equilibrium.</figcaption>
