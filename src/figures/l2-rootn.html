<figure class="nfig" data-nfig="l2-rootn">
  <div class="fig-controls nfig-bar">
    <div class="nfig-sliders">
      <label class="nfig-range"><span class="nfig-name">power a</span><input type="range" min="0" max="1" step="0.05" value="0" data-k="a"><span class="nfig-val" aria-hidden="true">0.00</span></label>
    </div>
    <button type="button" class="btn nfig-new">New paths</button>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 276" role="img" aria-label="Five paths of n to the power a times the error of the sample mean of standard normal draws, against n on a log scale up to 10000, with shaded bands holding the middle 50 and 90 percent of its distribution at each n."></svg>
  <p class="fig-note nfig-read" aria-live="polite">power a = 0.00   90% band at n = 10000: ±0.02, shrinking like n^(−0.50)   paths end between −0.01 and 0.01</p>
  <figcaption>The paths show n to the power a times the error of the sample mean, for standard normal draws, and the bands hold its middle 50 and 90 percent. At a = 0 the band collapses onto 0: that is the LLN. Slide a up. Below 0.5 it still collapses, above 0.5 it fans out, and only at a = 0.5 does it settle into a fixed band, the normal limit of the CLT, while the paths keep wandering inside it.</figcaption>
</figure>
