<figure class="nfig" data-nfig="mi3-shephard">
  <div class="nfig-seg" role="group" aria-label="Elasticity of substitution">
    <button type="button" class="nfig-opt" data-sig="0" aria-pressed="false">σ = 0, complements</button>
    <button type="button" class="nfig-opt" data-sig="0.5" aria-pressed="false">σ = 0.5</button>
    <button type="button" class="nfig-opt" data-sig="1" aria-pressed="true">σ = 1, Cobb Douglas</button>
    <button type="button" class="nfig-opt" data-sig="2" aria-pressed="false">σ = 2</button>
    <button type="button" class="nfig-opt" data-sig="inf" aria-pressed="false">σ = ∞, substitutes</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.4" max="3" step="0.05" value="1.6" data-k="p1"><span class="nfig-val" aria-hidden="true">1.60</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">reference price </span>p₁⁰</span><input type="range" min="0.4" max="3" step="0.05" value="1" data-k="p0"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 440" role="img" aria-label="Top: the indifference curve u = 5, the cheapest bundle h(p) with its isocost line, and the old bundle h(p0) with the dashed purple isocost line through it at today's prices. Bottom: the expenditure function e(p1, 5) and the purple line giving the cost of the old bundle, which touches e at the reference price."></svg>
  <p class="fig-note nfig-read" aria-live="polite">h(p) = (3.95, 6.32)   e(p, ū) = 12.65 at p₁ = 1.60
old bundle h(p⁰) = (5.00, 5.00) costs p·h(p⁰) = 13.00, so substitution saves 0.35
slope of e at p₁⁰ = 1.00: ∂e/∂p₁ = 5.00 = h₁(p⁰)</p>
  <figcaption>Constant elasticity of substitution utility with equal weights, ū = 5 and p₂ = 1; σ = 1 is u = √(x₁x₂), σ = 0 is min(x₁, x₂) and σ = ∞ is (x₁ + x₂)/2. Move p₁: the blue curve is the least cost of reaching ū, the purple line the cost of keeping the bundle bought at the reference price p₁⁰.</figcaption>
</figure>
