<figure class="nfig" data-nfig="mi5-eu">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn mi5-tog mi5-zoom" aria-pressed="false">Zoom near £10</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">elicited utility </span>u(£4)</span><input type="range" min="0" max="1" step="0.01" value="0.6" data-k="u"><span class="nfig-val" aria-hidden="true">0.60</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Lotteries over minus 2 pounds (bottom left), 4 pounds (bottom right) and 10 pounds (top) in the probability triangle, with the expected utility lines for u(minus 2) = 0, u(4) set by the slider and u(10) = 1. The bold blue line through 4 pounds for sure meets the left side at height u(4). The fixed lotteries L1 = (0, 0.2, 0.8) and L2 = (0.07, 0.03, 0.9) lie near the top on their own lines. A draggable lottery L shows its line and its equivalent gamble on the left side. Zoom magnifies the corner near 10 pounds."></svg>
  <p class="fig-note nfig-read" aria-live="polite">u(−£2) = 0,  u(£4) = 0.60,  u(£10) = 1:   £4 ∼ 0.60 × £10 + 0.40 × (−£2), mean £5.20, risk averse, premium £1.20
U(L₁) = 0.2 × 0.60 + 0.8 = 0.920   U(L₂) = 0.03 × 0.60 + 0.9 = 0.918   so L₁ ≻ L₂ (they swap at u(£4) = 0.588)
L = (0.30, 0.40, 0.30):   U(L) = 0.540,   L ∼ 0.540 × £10 + 0.460 × (−£2)</p>
  <figcaption>EU lines for u = (0, u(£4), 1). The bold line through £4 for sure meets the side of gambles between £10 and −£2 at height u(£4): that is the elicitation. L₁ = (0.2, 0.8; £4, £10) lies on a slightly higher line than L₂ = (0.07, 0.03, 0.9; −£2, £4, £10); zoom near £10 to see the gap. Move u(£4) below 0.588 and the ranking flips; drag L to rank any other lottery.</figcaption>
</figure>
