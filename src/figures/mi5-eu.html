<figure class="nfig" data-nfig="mi5-eu">
  <div class="nfig-seg" role="group" aria-label="Transformation of the Bernoulli utilities">
    <button type="button" class="nfig-opt" data-tf="id" aria-pressed="true">u</button>
    <button type="button" class="nfig-opt" data-tf="aff" aria-pressed="false">3 + 2u</button>
    <button type="button" class="nfig-opt" data-tf="sqrt" aria-pressed="false">√u</button>
  </div>
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">calibrated utility </span>u(£4)</span><input type="range" min="0" max="1" step="0.01" value="0.6" data-k="u"><span class="nfig-val" aria-hidden="true">0.60</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Lotteries over minus 2 pounds (bottom left), 4 pounds (bottom right) and 10 pounds (top) in the probability triangle, with the parallel indifference lines of expected utility for u(minus 2) = 0, u(4) set by the slider and u(10) = 1, possibly transformed. The fixed points L1 and L2 are the lotteries of slide 44. A draggable lottery L shows its own indifference line, which meets the left side, the gambles between 10 pounds and minus 2 pounds, at a red point whose height p is the utility U(L)."></svg>
  <p class="fig-note nfig-read" aria-live="polite">u(−£2) = 0.00   u(£4) = 0.600   u(£10) = 1.00
U(L₁) = 0.920   U(L₂) = 0.918   so L₁ ≻ L₂
L = (0.30, 0.40, 0.30):   U(L) = 0.540,   L ∼ 0.540 × £10 + 0.460 × (−£2)</p>
  <figcaption>The left side holds the gambles between the best prize, £10, and the worst, −£2, with the chance p of £10 as the height. The bold line through L meets it at the red point: L is as good as that gamble, and p is U(L). Move u(£4), drag L, and switch the transformation of the Bernoulli utilities.</figcaption>
</figure>
