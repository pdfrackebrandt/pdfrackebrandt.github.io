<figure class="nfig" data-nfig="clt">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">sample size n</span><input type="range" min="1" max="100" step="1" value="1" data-k="n"><span class="nfig-val" aria-hidden="true">1</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 262" role="img" aria-label="Histogram of 4000 standardised sample means from an Exponential(1) population, scaled as a density, with the standard normal density drawn on top. At n = 1 the histogram has the skewed exponential shape. As n grows it becomes symmetric and matches the normal curve."></svg>
  <p class="fig-note nfig-read" aria-live="polite">n = 1   skewness 2.10   theory 2/√n = 2.00</p>
  <figcaption>Each bar counts 4000 replications of √n(X̄ − 1) from Exponential(1) draws. Start at n = 1, the skewed exponential itself, and slide right: by n of 30 to 50 the histogram sits on the normal curve, and the skewness shrinks like 2/√n.</figcaption>
</figure>
