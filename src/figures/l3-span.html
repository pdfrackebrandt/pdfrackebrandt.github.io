<figure class="nfig" data-nfig="l3-span">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn l3-flat">Collinear columns</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="The columns a1 and a2 of a 2 by 2 matrix A drawn as arrows from the origin, the grid of their integer combinations, and a target point b. Dashed arrows show b as c1 times a1 plus c2 times a2. When the columns are collinear the grid collapses to one shaded line. Drag a1, a2 or b, or focus one and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">det A = 3.25, rank 2: c = A⁻¹b = (1.31, 1.23), the only solution</p>
  <figcaption>The faint grid shows every combination c₁a₁ + c₂a₂ with whole number weights, and the dashed path reaches b with the weights c = A⁻¹b. Drag a₁, a₂ or b. When the columns are collinear the grid collapses to one shaded line, and a red dotted gap shows how far b is from the nearest point A can reach.</figcaption>
</figure>
