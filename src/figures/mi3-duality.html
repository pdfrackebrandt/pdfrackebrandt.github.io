<figure class="nfig" data-nfig="mi3-duality">
  <div class="nfig-seg" role="group" aria-label="Preferences">
    <button type="button" class="nfig-opt" data-pref="cd" aria-pressed="true">√(x₁x₂)</button>
    <button type="button" class="nfig-opt" data-pref="leo" aria-pressed="false">min{x₁, x₂}</button>
    <button type="button" class="nfig-opt" data-pref="ql" aria-pressed="false">ln x₁ + x₂</button>
  </div>
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Link to explain">
    <button type="button" class="nfig-opt" data-link="roy" aria-pressed="true">Roy</button>
    <button type="button" class="nfig-opt" data-link="shep" aria-pressed="false">Shephard</button>
    <button type="button" class="nfig-opt" data-link="inv" aria-pressed="false">inverse</button>
    <button type="button" class="nfig-opt" data-link="same" aria-pressed="false">x = h, Slutsky</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 </span>p₁</span><input type="range" min="0.25" max="4" step="0.05" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 2 </span>p₂</span><input type="range" min="0.25" max="4" step="0.05" value="1" data-k="p2"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">wealth </span>w</span><input type="range" min="0.5" max="20" step="0.1" value="10" data-k="w"><span class="nfig-val" aria-hidden="true">10.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 280" role="group" aria-label="The duality map. Left column, the utility maximisation problem: indirect utility v of p and w above Marshallian demand x of p and w. Right column, the expenditure minimisation problem: the expenditure function e of p and u bar above Hicksian demand h of p and u bar. Each box shows its formula and its value at the chosen prices and wealth. Arrows: Roy from v to x, Shephard from e to h, inverse between v and e, and x equals h between the two demands. Each arrow can be pressed to explain that link."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ū = v(p, w) = 5.00, so both problems aim at the same utility: x = (5.00, 5.00), h = (5.00, 5.00)
Roy: ∂v/∂p₁ = −2.500 and ∂v/∂w = λ = 0.500, so −(∂v/∂p₁)/(∂v/∂w) = 5.00 = x₁(p, w)</p>
  <figcaption>The four objects for u = √(x₁x₂), min{x₁, x₂} or ln x₁ + x₂ at the prices and wealth you set, with ū = v(p, w). Pick a link, or press an arrow: Roy and Shephard differentiate a value function to get demand, the two value functions invert each other, and the two demands are the same bundle, whose derivative in p₁ is the Slutsky equation.</figcaption>
</figure>
