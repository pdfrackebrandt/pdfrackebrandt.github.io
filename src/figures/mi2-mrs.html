<figure class="nfig" data-nfig="mi2-mrs">
  <div class="nfig-seg" role="group" aria-label="Utility function">
    <button type="button" class="nfig-opt" data-fam="cd" aria-pressed="true">√(x₁x₂)</button>
    <button type="button" class="nfig-opt" data-fam="ql" aria-pressed="false">x₁ + 2√x₂</button>
    <button type="button" class="nfig-opt" data-fam="sub" aria-pressed="false">x₁ + 2x₂</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">scale </span>α</span><input type="range" min="0.25" max="3" step="0.05" value="1.5" data-k="al"><span class="nfig-val" aria-hidden="true">1.50</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">shift in good 1, </span>t</span><input type="range" min="-4" max="6" step="0.25" value="2" data-k="t"><span class="nfig-val" aria-hidden="true">2.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 380" role="group" aria-label="Indifference curves through three bundles: x in blue, the scaled bundle alpha x in purple and the shifted bundle x + t e1 in green, each with a short piece of its tangent line, whose slope is minus the MRS. Dashed guides show the ray from the origin through x and the horizontal line through x. Drag x, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">√(x₁x₂), Cobb Douglas
x = (2.00, 4.00): MRS = u₁/u₂ = 2.00
αx = (3.00, 6.00): MRS = 2.00   x + te₁ = (4.00, 4.00): MRS = 1.00</p>
  <figcaption>Drag x and move α and t. The blue, purple and green pieces of line touch the indifference curves through x, αx and x + te₁, and their slopes are minus the MRS. The dashed guides are the ray through x and the horizontal line through x.</figcaption>
</figure>
