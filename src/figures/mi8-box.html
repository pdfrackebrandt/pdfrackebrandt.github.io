<figure class="nfig" data-nfig="mi8-box">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">relative price of good 1, </span>p</span><input type="range" min="0.1" max="2" step="0.01" value="0.5" data-k="p"><span class="nfig-val" aria-hidden="true">0.50</span></label>
  </div>
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn mi8-clear">Clear the market</button>
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 400" role="group" aria-label="The Edgeworth box of the exchange example, 8 wide and 6 high, with consumer a measured from the bottom left corner and consumer b from the top right. A draggable endowment point omega, the indifference curves of a and b through it and the shaded lens between them, the red dashed contract curve, an orange budget line through omega with slope minus p, the two demands at p with their indifference curves, an arrow between the demands that is the excess demand, and a ring at the equilibrium allocation E."></svg>
  <p class="fig-note nfig-read" aria-live="polite">ωᵃ = (4.00, 2.00), ωᵇ = (4.00, 4.00);  p = 0.500
xᵃ(p) = (2.00, 3.00), xᵇ(p) = (6.00, 3.00)
z = (0.00, 0.00): both markets clear at p* = 0.500, and E lies on the contract curve
at E = (2.00, 3.00): uᵃ 3.47 → 3.99, uᵇ 2.77 → 2.89</p>
  <figcaption>The exchange example in the Edgeworth box: a's quantities from the bottom left corner, b's from the top right corner. The thin curves are the indifference curves through the endowment ω, and the shaded lens between them holds every allocation both prefer to ω; the red dashed curve is the contract curve. The orange budget line through ω has slope −p. The blue and green dots are what a and b demand on it, each with the indifference curve it reaches, and the arrow from b's demand to a's is the excess demand z. Move p or drag ω: only at the clearing price p* do the two demands meet, at E on the contract curve inside the lens, where both indifference curves touch the budget line.</figcaption>
</figure>
