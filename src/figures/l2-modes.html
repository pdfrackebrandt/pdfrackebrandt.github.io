<figure class="nfig" data-nfig="l2-modes">
  <div class="fig-controls nfig-bar">
    <div class="nfig-seg" role="group" aria-label="Sequence">
      <button type="button" class="nfig-opt" data-ex="spike" aria-pressed="true">A: 1 with prob 1/n</button>
      <button type="button" class="nfig-opt" data-ex="spike2" aria-pressed="false">B: 1 with prob 1/n²</button>
      <button type="button" class="nfig-opt" data-ex="tall" aria-pressed="false">C: n when U &lt; 1/n</button>
    </div>
    <button type="button" class="btn nfig-new">New paths</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">cursor n</span><input type="range" min="0" max="27" step="1" value="17" data-k="n"><span class="nfig-val" aria-hidden="true">100</span></label>
  </div>
  <svg class="nfig-plot nfig-drag" viewBox="0 0 520 300" role="img" aria-label="Thirty independent sample paths, one per row, against n on a log scale from 1 to 10000. A mark sits wherever a path is away from its limit 0. A dashed cursor splits the axis: marks to its left are grey, marks at or after it are red. Drag across the plot or use the slider to move the cursor."></svg>
  <p class="fig-note nfig-read" aria-live="polite">at n = 100:  P(miss at n) = 1/n = 0.01   P(a miss at some m ≥ n) = 1   E(X²) = 1/n = 0.01</p>
  <figcaption>Each row is one path of the sequence and each mark is a time n at which the path is away from 0. Move the cursor right. In A the chance of a mark at any single n dies out, yet red marks keep appearing in almost every row: convergence in probability without almost sure convergence. In B the rows go clean. In C each row has one block of misses and then stops for good, so it converges almost surely, but the misses are of size n and its mean square error grows.</figcaption>
</figure>
