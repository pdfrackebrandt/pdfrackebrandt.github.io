  <svg class="nfig-plot" viewBox="0 0 520 560" role="img" aria-label="Left or top: expansion paths in commodity space for Cobb Douglas (a ray from the origin), Stone Geary (a line starting at gamma = (2, 1)) and quasilinear preferences (along the x1 axis, then vertical), with dotted budget lines for w = 2 to 10 and the current budget line. Right or below: the Engel curves for good 1 against wealth, with the current w marked."></svg>
