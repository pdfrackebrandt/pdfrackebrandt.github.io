<figure class="nfig" data-nfig="l3-proj">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn l3-iota">x = ι</button>
    <button type="button" class="btn l3-again">Move y to Py</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Two vectors x and y drawn from the origin. The dashed line is every multiple of x. The dot Py is the point of that line closest to y, and the residual My runs from Py to y at a right angle to the line. The projection matrix P is shown top left. Drag either arrow tip, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">x′y = 5.50   x′x = 10.00   ĉ = x′y/x′x = 0.55
Py = (1.65, 0.55)   My = (−0.65, 1.95)   x′My = 0.00</p>
  <figcaption>Drag the tips of x and y, or focus one and use the arrow keys. Py is the point on the dashed line closest to y, and the red residual My meets the line at a right angle. Top left is the projection matrix P = xx′/x′x.</figcaption>
</figure>
