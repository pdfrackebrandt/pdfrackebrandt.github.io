<figure class="nfig" data-nfig="mi8-excess">
  <div class="nfig-seg" role="group" aria-label="Right hand chart">
    <button type="button" class="nfig-opt" data-mode="z" aria-pressed="true">Excess demands z₁, z₂</button>
    <button type="button" class="nfig-opt" data-mode="walras" aria-pressed="false">Walras' law: p z₁ and z₂</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">relative price of good 1, </span>p</span><input type="range" min="0.1" max="1.5" step="0.01" value="1" data-k="p"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 480" role="group" aria-label="Left or top: the Edgeworth box of the exchange example with the offer curve of a in blue and the offer curve of b, drawn in a's coordinates, in green. They meet at the endowment omega and cross at E. The budget line through omega at the chosen price p cuts each offer curve at that consumer's demand. Right or below: the excess demands z1 and z2 against p, or p times z1 and z2, which are mirror images; press or drag along this chart to set p."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p = 1.00: xᵃ(p) = (1.50, 4.50), ω̄ − xᵇ(p) = (4.00, 2.00)
z₁ = −2.50, z₂ = 2.50;  p z₁ = −2.50, so p z₁ + z₂ = 0.00
good 1 is in excess supply: p falls toward p* = 0.5, the only zero of z₁
b demands its own endowment here: p = MRSᵇ(ω) = 1</p>
  <figcaption>Left: the offer curves of a and b in a's coordinates, the demand of each traced as p varies. Each passes through ω at the price equal to its MRS there (p = 0.167 for a, p = 1 for b), and they cross away from ω only at E = (2, 3). Right: the excess demands z₁ and z₂, both zero at p* = ½; z₁ falls everywhere, so the equilibrium is unique. Switch to Walras' law to see p z₁ and z₂ as mirror images at every price, not only at p*. Move p with the slider or along the chart.</figcaption>
</figure>
