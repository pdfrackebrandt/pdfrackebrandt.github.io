<figure class="nfig" data-nfig="mi4-cvev">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn mi4-swap">Swap old and new prices</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">old price of good 1 </span>p⁰₁</span><input type="range" min="0.8" max="2.4" step="0.05" value="2" data-k="p0"><span class="nfig-val" aria-hidden="true">2.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">new price of good 1 </span>p¹₁</span><input type="range" min="0.8" max="2.4" step="0.05" value="1" data-k="p1"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 380" role="img" aria-label="The goods plane for u = 2 root of x1 x2 with wealth 100 and p2 = 1. The old and new budgets, the indifference curves u0 and u1 through the old and new choices, the line at new prices that just reaches u0 and the line at old prices that just reaches u1. Arrows on the x2 axis mark CV and EV in money."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p₁: 2.00 → 1.00, a fall: u⁰ = 70.71, u¹ = 100.00
CV = w − e(p¹, u⁰) = 100 − 70.71 = 29.29
EV = e(p⁰, u¹) − w = 141.42 − 100 = 41.42
the reverse change has CV = −41.42 = −EV and EV = −29.29 = −CV</p>
  <figcaption>CV and EV in the goods space for u = 2√(x₁x₂), w = 100, p₂ = 1, so a budget line meets the x₂ axis at its money. CV is the gap between w and the cheapest way to reach u⁰ at the new prices (red dotted), EV the gap between w and the cheapest way to reach u¹ at the old prices (blue dotted); hollow dots mark those cheapest bundles. Swap the prices to see CV of a rise equal −EV of the fall.</figcaption>
</figure>
