<figure class="nfig" data-nfig="mi4-demand">
  <div class="nfig-seg" role="group" aria-label="Good">
    <button type="button" class="nfig-opt" data-pre="nor" aria-pressed="true">Normal</button>
    <button type="button" class="nfig-opt" data-pre="inf" aria-pressed="false">Inferior</button>
    <button type="button" class="nfig-opt" data-pre="gif" aria-pressed="false">Giffen</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">price of good 1 where the curves cross, </span>p̄₁</span><input type="range" min="0.8" max="3" step="0.05" value="1" data-k="p"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot mi4-grab" viewBox="0 0 520 360" role="img" aria-label="Demand for good 1 against its own price: the Marshallian demand x1(p, w) and the Hicksian demand h1(p, u bar) at the utility u bar = v(p, w), which cross at the chosen price. The horizontal guide through the crossing can be dragged."></svg>
  <p class="fig-note nfig-read" aria-live="polite">p̄₁ = 1.00   x̄₁ = 50.00   ū = v(p, w) = 100.00
slope of x₁ in p₁ = −50.00 = SE −25.00 + IE −25.00
ε₁₁ = −1.00 = εʰ₁₁ − b₁ε₁w = −0.50 − 0.50 × 1.00
normal: IE ≤ 0 reinforces SE, so x₁ is flatter than h₁ in the (x₁, p₁) plane</p>
  <figcaption>Marshallian and Hicksian demand through the same point, p₂ = 1. Normal: u = 2√(x₁x₂), w = 100. Inferior: the Gorman form e = 40p₁ + u(2√(p₁p₂) − p₁), w = 150, inferior for 1 &lt; p₁ &lt; 4. Giffen: u = ln(x₁ − 1) − 2.5 ln(9.5 − x₂), w = 10. Move p̄₁ (or drag the guide) to choose where ū = v(p, w) is set; the income effect dampens the price response of an inferior good and reverses it for a Giffen good.</figcaption>
</figure>
