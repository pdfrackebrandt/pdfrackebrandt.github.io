<figure class="nfig" data-nfig="mi7-profit">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">output price </span>P</span><input type="range" min="0.4" max="3" step="0.05" value="2" data-k="P"><span class="nfig-val" aria-hidden="true">2.00</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">input price </span>p</span><input type="range" min="0.75" max="2" step="0.05" value="1" data-k="p"><span class="nfig-val" aria-hidden="true">1.00</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 470" role="group" aria-label="First panel: the production function q = square root of z, the blue iso profit line q = π/P + (p/P) z touching it at the red optimum z star, and a draggable orange plan z0 on the curve with its dashed grey iso profit line. Second panel: the profit function π(P, p) = P squared over 4p against the output price, convex, with a red tangent of slope q star at the current P, and the dashed orange profit P q0 minus p z0 of the fixed plan, a line below π that touches it at P0 = 2 p q0. Drag the plan, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">P = 2.00, p = 1.00: Pf′(z) = p at z* = (P/2p)² = 1.00, q* = 1.00, π(P, p) = P²/4p = 1.00
plan z⁰ = 1.00, q⁰ = 1.00 earns Pq⁰ − pz⁰ = 1.00 = π: it is the optimum
as a fixed plan its profit is linear in P and touches the convex π at P⁰ = 2pq⁰ = 2.00
Hotelling: ∂π/∂P = P/2p = 1.00 = q*   ∂π/∂p = −P²/4p² = −1.00 = −z*</p>
  <figcaption>One input, f = √z. Left: the highest iso profit line that touches f gives z* = (P/2p)² and q* = P/2p; at P = 2, p = 1 that is z* = 1, q* = 1. Right: π = P²/4p lies above the profit Pq⁰ − pz⁰ of any fixed plan and touches it at the price P⁰ where that plan is optimal, with slope q* there (Hotelling). Move P and p, and drag the plan z⁰ along f.</figcaption>
</figure>
