<figure class="nfig" data-nfig="l1-quantile">
  <div class="nfig-seg" role="group" aria-label="Distribution">
    <button type="button" class="nfig-opt" data-dist="norm" aria-pressed="true">Normal</button>
    <button type="button" class="nfig-opt" data-dist="flat" aria-pressed="false">Flat stretch</button>
    <button type="button" class="nfig-opt" data-dist="atom" aria-pressed="false">Atom at 0</button>
  </div>
  <svg class="nfig-plot nfig-drag" viewBox="0 0 520 336" tabindex="0" role="slider" aria-label="Top: a CDF with a guide from the probability level tau across to the curve and down to the quantile Q of tau. Bottom: the histogram of F of X for 2000 draws, with the uniform density at height 1. Drag up and down on the CDF or across the histogram, or use the arrow keys, to move tau." aria-valuemin="0.005" aria-valuemax="0.995" aria-valuenow="0.3" aria-valuetext="tau = 0.300, q = −0.524"></svg>
  <p class="fig-note nfig-read" aria-live="polite">τ = 0.300   q = Q(τ) = −0.524   F(q) = 0.300
P(F(X) ≤ τ) = 0.300 = τ   share of draws: 0.297</p>
  <figcaption>Drag up and down on the CDF, or use the arrow keys, to pick τ: the guide runs across to the curve and down to the quantile q = Q(τ). Under Normal, τ = 0.975 gives 1.96. Under Flat stretch set τ = 0.5: every x on the flat solves F(x) = 0.5 and Q takes the left end, yet F(X) stays uniform. Under Atom at 0, F jumps from 0.35 to 0.65: Q(τ) = 0 for every τ in that range, and F(X) piles 30% of the draws into the bar at 0.65 with a gap below it, so the PIT needs a continuous F.</figcaption>
</figure>
