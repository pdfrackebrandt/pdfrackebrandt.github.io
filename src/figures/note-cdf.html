<figure class="nfig" data-nfig="cdf">
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Distribution">
    <button type="button" class="nfig-opt" data-dist="bern" aria-pressed="false">Bernoulli(0.3)</button>
    <button type="button" class="nfig-opt" data-dist="unif" aria-pressed="false">Uniform(0, 1)</button>
    <button type="button" class="nfig-opt" data-dist="norm" aria-pressed="true">Normal(0, 1)</button>
    <button type="button" class="nfig-opt" data-dist="expo" aria-pressed="false">Exponential(1)</button>
  </div>
  <svg class="nfig-plot nfig-drag" viewBox="0 0 520 262" tabindex="0" role="slider" aria-label="Guide on the CDF F(x), drawn on top, and the density f(x), drawn below on the same x axis. Arrow keys move the guide." aria-valuemin="-4" aria-valuemax="4" aria-valuenow="0.5" aria-valuetext="x = 0.50, F(x) = 0.69, f(x) = 0.35"></svg>
  <p class="fig-note nfig-read" aria-live="polite">x = 0.50   F(x) = 0.69   f(x) = 0.35</p>
  <figcaption>Move across the plot or use the arrow keys: F(x) is the shaded area under f to the left of x. Pick Bernoulli and step onto x = 0, where the filled dot gives F(0) = 0.7, so the CDF is right continuous.</figcaption>
</figure>
