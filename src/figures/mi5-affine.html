<figure class="nfig" data-nfig="mi5-affine">
  <div class="nfig-seg nfig-seg4" role="group" aria-label="Transformation of the Bernoulli utilities">
    <button type="button" class="nfig-opt" data-tf="id" aria-pressed="true">u</button>
    <button type="button" class="nfig-opt" data-tf="aff" aria-pressed="false">3 + 2u</button>
    <button type="button" class="nfig-opt" data-tf="sqrt" aria-pressed="false">√u</button>
    <button type="button" class="nfig-opt" data-tf="sq" aria-pressed="false">u²</button>
  </div>
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 320" role="group" aria-label="The probability triangle in the plane of p1 and p3 for Bernoulli utilities u = (0, 1, 4), transformed prize by prize by the chosen function. Green lines are the indifference lines of the transformed utilities. A = (0, 1, 0), the middle prize for sure, sits at the origin with its line in blue; the draggable lottery B, at first (0.75, 0, 0.25), has its line dashed in red. A dotted line marks the line through A under u."></svg>
  <p class="fig-note nfig-read" aria-live="polite">v = u:   v = (0.00, 1.00, 4.00),   slope (v₂ − v₁) ÷ (v₃ − v₂) = 0.333
A = (0, 1, 0):  V(A) = 1.000   B = (0.75, 0.00, 0.25):  V(B) = 1.000   so A ∼ B</p>
  <figcaption>Under u = (0, 1, 4), A = (0, 1, 0) and B = (¾, 0, ¼) lie on one line, slope 1 over 3. Any affine v = a + bu, b &gt; 0, keeps that slope and so every ranking. A monotone transform that is not affine turns the lines: under √u = (0, 1, 2) the slope is 1 and A is better; under u² it is 1 over 15 and B is better. Switch v and drag B.</figcaption>
</figure>
