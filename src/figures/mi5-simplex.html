<figure class="nfig" data-nfig="mi5-simplex">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn mi5-tog mi5-areas" aria-pressed="false">Show areas</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="The probability simplex for three prizes drawn as an equilateral triangle with altitude 1. The vertices are the degenerate lotteries on z1 (bottom left), z2 (bottom right) and z3 (top). A draggable lottery L drops a perpendicular to each side: the drop to the side opposite vertex n has length p n, and the three lengths add up to 1. Show areas shades the three triangles formed by L and two vertices; their areas are the same three probabilities. Drag L, or focus it and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">L = (0.50, 0.25, 0.25)   distances 0.50 + 0.25 + 0.25 = 1.00
inside: every prize can happen</p>
  <figcaption>Viviani: the perpendicular distance from L to the side opposite vertex n is pₙ, and the three distances always add to the altitude, 1. A vertex is a degenerate lottery, a side holds the lotteries that rule out one prize. Drag L, or press Show areas: each shaded triangle has base s and height pₙ, which is the proof.</figcaption>
</figure>
