  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 300" role="group" aria-label="Left: partial sums over the first M tosses of the St. Petersburg game. The expected value with prizes 2 to the m grows by 1 per toss; expected log utility with the same prizes levels off at 2 ln 2; expected log utility with prizes e to the 2 to the m grows by 1 per toss again. Right: a banker who stops the game after K tosses. The expected value is K plus 1; the certainty equivalent of a CRRA player with the chosen r levels off. Drag the markers on the two horizontal axes, or focus one and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">M = 10 tosses counted: E[x] = 10, E[ln x] = 1.379 (limit 2 ln 2 = 1.386), with prizes e^(2ᵐ) E[ln x] = 10

  <figcaption>The St. Petersburg game with prizes 2^m. Left: the expected value diverges and expected log utility converges to 2 ln 2, but prizes e^(2^m) bring the divergence back under log utility. Right: with a capped banker the expected value is K + 1, while the certainty equivalent converges (to 4 for the log, r = 1). Move r to see that every r above 0 gives a finite limit with these prizes.</figcaption>
