<figure class="nfig" data-nfig="l3-vol">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn l3-flat">t = 0, slide 25</button>
    <button type="button" class="btn l3-view">Reset view</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">lift of V1 </span>t</span><input type="range" min="-1" max="1" step="0.05" value="0.6" data-k="t"><span class="nfig-val" aria-hidden="true">0.60</span></label>
  </div>
  <svg class="nfig-plot l3-rot" viewBox="0 0 520 320" tabindex="0" role="group" aria-label="Three dimensional view of the box spanned by V1 = (1, 1, 1 + t), V2 = (1, 0, 0) and V3 = (0, 1, 1), turned so that the plane of V2 and V3 is the shaded floor. A dotted drop shows the height of V1 above that plane. The volume is the absolute value of t. Drag sideways, or focus the plot and use the arrow keys, to turn the view."></svg>
  <p class="fig-note nfig-read" aria-live="polite">t = 0.60   det [V₁ V₂ V₃] = 0.60   rank 3
base area √2, height 0.42, volume √2 × 0.42 = 0.60</p>
  <figcaption>The shaded floor is the plane of V₂ and V₃, and the purple dotted drop is the height of V₁ above it, so the volume is base area times height. The slider t lifts V₁ out of the plane; the box turns red when V₁ crosses to the other side. Drag sideways to turn the box.</figcaption>
</figure>
