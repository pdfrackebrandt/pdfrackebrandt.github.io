<figure class="nfig" data-nfig="l1-joint">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-indep">Make independent</button>
    <button type="button" class="btn nfig-reset">Slide 68 table</button>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 290" role="group" aria-label="Mosaic of the joint distribution of a degree and a weekly wage above 1000. The two columns are no degree and degree, with widths equal to their probabilities. Inside each column the blue part is the share earning above 1000, so each rectangle's area is a joint probability. A dashed line marks the overall share earning above 1000. Drag the column boundary or the level in either column, or focus a handle and use the arrow keys."></svg>
  <p class="fig-note nfig-read" aria-live="polite">f(1,1) = 0.30 against P(X₁=1) P(X₂=1) = 0.50 × 0.40 = 0.20: dependent
P(X₁=1 | X₂=0) = 0.33   P(X₁=1 | X₂=1) = 0.75   P(X₁=1) = 0.50
Cov = 0.100   Corr = 0.408</p>
  <figcaption>Drag the boundary between the columns to change the share with a degree, and the level inside a column to change the share earning over 1000 there. Each area is a joint probability, and the dashed line is the overall share, the average of the two levels weighted by the column widths. Press Make independent: both levels move onto the dashed line, f(1,1) equals the product of the margins, and Cov falls to 0.</figcaption>
</figure>
