<figure class="nfig" data-nfig="ma6-path">
  <div class="nfig-seg" role="group" aria-label="Permanent shock">
    <button type="button" class="nfig-opt" data-shock="prod" aria-pressed="true">Productivity a up 10%</button>
    <button type="button" class="nfig-opt" data-shock="sep" aria-pressed="false">Separations λ up 50%</button>
  </div>
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn ma6-play">Play</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">months after the shock t</span><input type="range" min="0" max="8" step="0.1" value="0" data-k="t"><span class="nfig-val" aria-hidden="true">0.0</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 270" role="group" aria-label="Left: the u, v plane with the green Beveridge curve, the old job creation ray dashed and the new one in blue. The dark trail starts at the old steady state, jumps straight up or down to the new ray at the old unemployment rate, then slides along the ray to the new steady state. Right: unemployment in purple and vacancies in blue as percent deviations from the old steady state against months after the shock, with the part still to come drawn faint."></svg>
  <p class="fig-note nfig-read" aria-live="polite">t = 0.0 months   u = 6.24%   v = 2.00%   θ = 0.321 from t = 0 on (was 0.261)
speed λ + θq(θ) = 0.600 a month: half the gap to the new u = 5.66% closes in ln 2/0.600 = 1.15 months</p>
  <figcaption>The baseline economy of the previous figure, hit at t = 0 by a permanent shock. Press Play or move t: tightness jumps at once, so vacancies jump, while unemployment follows u̇ = λ(1 − u) − θq(θ)u from where it was.</figcaption>
</figure>
