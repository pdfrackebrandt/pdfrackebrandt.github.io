<figure class="nfig" data-nfig="ma8-market">
  <div class="fig-controls nfig-bar">
    <button type="button" class="btn nfig-reset">Reset</button>
    <button type="button" class="btn ma8-tog" aria-pressed="false">Try a rate</button>
  </div>
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name"><span class="vh">banker net worth </span>N</span><input type="range" min="0" max="0.3" step="0.01" value="0.1" data-k="N"><span class="nfig-val" aria-hidden="true">0.10</span></label>
    <label class="nfig-range"><span class="nfig-name"><span class="vh">divertible share </span>θ</span><input type="range" min="0" max="0.6" step="0.01" value="0.3" data-k="theta"><span class="nfig-val" aria-hidden="true">0.30</span></label>
  </div>
  <svg class="nfig-plot nfig-drag2" viewBox="0 0 520 360" role="group" aria-label="The deposit market: deposits d across, the deposit rate R up. The green curve is household deposit supply with bank profits returned. The blue bank demand is flat at R k up to the cap at R k, then runs down the red no default cap d bar of R toward the floor one minus theta times R k. The shaded red area above the cap is where a promise is not credible. The black dot is the equilibrium, the open green circle the first best d star at R k, and the orange bracket the spread. With Try a rate on, drag the horizontal line to a trial rate and read off supply and demand."></svg>
  <p class="fig-note nfig-read" aria-live="polite">N = 0.10 &lt; N̄ = 0.178: the no default condition binds
R = 0.970, spread 0.130, d = 0.385 against first best d* = 0.454, λ = 0.65</p>
  <figcaption>Households supply deposits along the green curve (y = 1, β = 0.96, γ = 0.5, bank profits returned). Bankers demand any amount at Rᵏ = 1.1 up to what they can credibly take, and below Rᵏ exactly the red cap d̄(R). Turn on Try a rate and drag the line: away from equilibrium one side is short and R moves. Lower N or raise θ to make the cap bind.</figcaption>
</figure>
