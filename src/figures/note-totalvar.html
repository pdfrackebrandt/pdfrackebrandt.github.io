<figure class="nfig" data-nfig="totalvar">
  <div class="nfig-sliders">
    <label class="nfig-range"><span class="nfig-name">Between groups</span><input type="range" min="0" max="2" step="0.05" value="1" data-k="b"><span class="nfig-val" aria-hidden="true">1.00</span></label>
    <label class="nfig-range"><span class="nfig-name">Within groups</span><input type="range" min="0.1" max="1.5" step="0.05" value="0.6" data-k="s"><span class="nfig-val" aria-hidden="true">0.60</span></label>
  </div>
  <svg class="nfig-plot" viewBox="0 0 520 286" role="img" aria-label="Three groups of 15 dots at X = 1, 2 and 3, each with a solid line at its group mean and a dashed line at the overall mean. Below, one bar splits Var(Y) into a faint within part and a solid between part."></svg>
  <p class="fig-note nfig-read" aria-live="polite">Var(Y) = 1.03 = 0.36 within + 0.67 between   R² = 0.65</p>
  <figcaption>Spread the dots inside each group and the faint within part grows; pull the group means apart and the solid between part grows. Var(Y) is always their sum, and R² is the between share.</figcaption>
</figure>
